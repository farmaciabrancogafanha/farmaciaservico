  if (linkRaiz) { linkRaiz.href = urlRaiz; linkRaiz.textContent = urlRaiz; }

  // Em hostnames listados em HOSTNAMES_SEM_LINKTREE (sites partilhados
  // com farmácias parceiras), o bloco do Linktree é escondido.
  if (HOSTNAMES_SEM_LINKTREE.includes(location.hostname)) {
    footer.querySelector(".fo-direita").style.display = "none";
  }

  // Linha de diagnóstico de viewport. Vive na coluna central (.fo-meio)
  // do rodapé, ao mesmo nível vertical dos URLs das colunas laterais.
  // O footer já está anexado à caixa, e a .fo-meio existe no innerHTML
  // acima, portanto o querySelector encontra-a.
  const debugViewport = document.createElement("div");
  debugViewport.className = "update-debug";
  footer.querySelector(".fo-meio").appendChild(debugViewport);
  document.body.appendChild(overlay);

  return { overlay, thsDias, celulas, zonaRelogio, relogio, debugViewport, tempoFuncionamento: tf, subtitulo: st, hojeIndice: -1 };
}

// Devolve a data ISO (YYYY-MM-DD) da segunda-feira da semana de `p`.
function inicioDaSemanaISO(p) {
  // Date.getUTCDay: 0=Dom, 1=Seg, ..., 6=Sáb. Queremos Seg como início.
  const [y, mo, d] = [p.ano, p.mes, p.dia];
  const dt = new Date(Date.UTC(y, mo - 1, d));
  const dia = dt.getUTCDay();             // 0..6
  const offset = (dia + 6) % 7;           // 0 se Seg, 6 se Dom
  dt.setUTCDate(dt.getUTCDate() - offset);
  const yy = dt.getUTCFullYear();
  const mm = String(dt.getUTCMonth() + 1).padStart(2, "0");
  const dd = String(dt.getUTCDate()).padStart(2, "0");
  return `${yy}-${mm}-${dd}`;
}

// Preenche a tabela com a semana corrente. Idempotente: pode ser
// chamado várias vezes; sobrescreve o estado anterior.
// Posiciona horizontalmente o relógio digital por cima da coluna do
// dia hoje, lendo a posição real da <th> correspondente. Necessário
// chamar após popular a tabela e sempre que o viewport for redimensionado.
function posicionarRelogioHorario(refs) {
  if (!refs || refs.hojeIndice < 0) return;
  const th = refs.thsDias[refs.hojeIndice] && refs.thsDias[refs.hojeIndice].th;
  if (!th || !refs.zonaRelogio) return;
  const rZona = refs.zonaRelogio.getBoundingClientRect();
  const rTh   = th.getBoundingClientRect();
  // Centro horizontal da <th> relativo à zona-relógio.
  const centro = rTh.left - rZona.left + rTh.width / 2;
  refs.relogio.style.left = centro + "px";
}

// Actualiza o display do relógio digital no formato hh:mm:ss.
function atualizarRelogioHorario(refs, p) {
  if (!refs || !refs.relogio) return;
  const hh = String(p.h).padStart(2, "0");
  const mm = String(p.m).padStart(2, "0");
  const ss = String(p.s).padStart(2, "0");
  refs.relogio.textContent = `${hh}:${mm}:${ss}`;
}

// Rótulos das células no dia corrente, em PT-PT.
const HORARIO_ROTULOS = { aberto: "Aberta", almoco: "Almoço", fechado: "Fechada" };

// Actualiza, a cada tick, a coluna do dia corrente para reflectir o
// andamento do dia: células de horas já passadas viram baças (igual
// aos outros dias), a célula da hora em curso recebe uma linha
// horizontal proporcional aos minutos, células futuras mantêm-se
// vivas. Função idempotente; chamada a cada segundo.
function tickEstadoHoje(refs, p) {
  if (!refs || refs.hojeIndice < 0 || !refs.estadosHoje) return;
  // Antes das 8h o período útil da tabela ainda não começou; toda a
  // coluna fica baça. A partir das 8h, cada hora ganha cor viva até
  // ser ultrapassada, altura em que volta a ficar baça.
  const antesDoInicio = p.h < HORARIO_HORA_INI;
  for (let row = 0; row < refs.celulas.length; row++) {
    const hCelula = HORARIO_HORA_INI + row;
    const td = refs.celulas[row][refs.hojeIndice];
    const estado = refs.estadosHoje[row];
    const extra  = refs.extrasHoje[row];
    td.classList.remove("hoje-actual", "hoje-passada", "ultima-hora");
    if (antesDoInicio || hCelula < p.h) {
      // Hora já passada (ou todo o dia, se ainda antes das 8h): a
      // célula fica idêntica às dos outros dias, sem texto. A coluna
      // continua distinguível pelo cabeçalho (data e tipo do dia).
      td.classList.add("hoje-passada");
      td.textContent = "";
    } else if (hCelula === p.h) {
      // Hora em curso: cor viva + linha horizontal preta proporcional
      // aos minutos. Se for a última hora antes do fecho num dia
      // alargado (20h-21h numa célula extra), assinala-se com classe
      // adicional para vermelho de alerta — sincroniza com o "Restam
      // Xh Xmin até ao fecho" do site principal que também fica
      // vermelho durante esta hora.
      td.classList.add("hoje-actual");
      if (extra && hCelula === 20) td.classList.add("ultima-hora");
      td.textContent = HORARIO_ROTULOS[estado] || "";
      td.style.setProperty("--minuto-pct", (p.m / 60 * 100) + "%");
    } else {
      // Hora futura: cor viva, rótulo visível.
      td.textContent = HORARIO_ROTULOS[estado] || "";
    }
  }
}

function popularTabelaHorario(refs, calendario, dados, p) {
  if (!refs) return;
  const isoHoje = `${p.ano}-${String(p.mes).padStart(2,"0")}-${String(p.dia).padStart(2,"0")}`;
  const iniSemana = inicioDaSemanaISO(p);

  // Pré-computar horários e datas dos 7 dias.
  const horariosSemana = [];
  const isosSemana = [];
  for (let i = 0; i < 7; i++) {
    const iso = adicionarDias(iniSemana, i);
    isosSemana.push(iso);
    horariosSemana.push(horarioBrancoDia(iso, calendario, dados));
  }

  // Total de horas de porta aberta da semana (soma dos 7 dias; almoços
  // não contam, ver horasAbertoDia). Formata sem casas decimais quando
  // inteiro; com vírgula decimal (PT-PT) caso surja meia hora no futuro.
  // Número da semana, dias de funcionamento (dias com porta aberta) e
  // total de horas, para o subtítulo e a linha de métricas.
  const numSemana = fmtSemana(semanaISO(iniSemana));
  const diasFunc = horariosSemana.reduce((acc, hd) => acc + (horasAbertoDia(hd) > 0 ? 1 : 0), 0);
  const URL_EST = "https://farmaciaservicoilhavoaveiro.netlify.app/farmaciabranco/estatistica";
  if (refs.subtitulo) {
    // Subtítulo com o nº da semana, ligado à tabela de estatística.
    refs.subtitulo.innerHTML = `<a class="horario-link-est" href="${URL_EST}">Semana ${numSemana} - Horário</a>`;
  }
  if (refs.tempoFuncionamento) {
    const totalHoras = horariosSemana.reduce((acc, hd) => acc + horasAbertoDia(hd), 0);
    const txt = Number.isInteger(totalHoras)
      ? String(totalHoras)
      : totalHoras.toFixed(1).replace(".", ",");
    refs.tempoFuncionamento.textContent =
      `Dias de funcionamento: ${diasFunc} ${diasFunc === 1 ? "dia" : "dias"}\u00A0\u00A0Horas de funcionamento: ${txt} h`;
  }

  // Cabeçalho: data por baixo de cada dia, classificar cronologicamente
  // (passado/hoje/futuro) e guardar o índice do dia corrente para o
  // reposicionamento do relógio digital.
  refs.hojeIndice = -1;
  for (let i = 0; i < 7; i++) {
    const iso = isosSemana[i];
    refs.thsDias[i].sp.textContent = iso;
    const th = refs.thsDias[i].th;
    th.classList.remove("passado", "hoje", "futuro");
    if (iso < isoHoje) {
      th.classList.add("passado");
    } else if (iso > isoHoje) {
      th.classList.add("futuro");
    } else {
      th.classList.add("hoje");
      refs.hojeIndice = i;
    }

    // Classificar tipo de horário: Fechada / Normal / Alargado.
    const horario = horariosSemana[i];
    const tipoSp = refs.thsDias[i].tipo;
    if (!horario.aberto) {
      tipoSp.textContent = "Fechada";
      tipoSp.className = "tipo fechada";
    } else if (eDisponibilidadeBranco(iso, dados)) {
      tipoSp.textContent = "Alargado";
      tipoSp.className = "tipo alargado";
    } else {
      tipoSp.textContent = "Normal";
      tipoSp.className = "tipo normal";
    }
  }

  // Corpo: para cada (hora, dia), aplicar classe de estado e destacar
  // a coluna do dia corrente. As células da coluna do dia corrente
  // levam só a classe base 'hoje' aqui; a sub-classificação cronológica
  // (passada/em-curso/futura) e o rótulo de texto são geridos por
  // tickEstadoHoje a cada segundo. Guardamos os estados da coluna do
  // dia para essa função poder pôr o texto certo sem recalcular.
  refs.estadosHoje = [];
  refs.extrasHoje  = [];
  for (let row = 0; row < refs.celulas.length; row++) {
    const h = HORARIO_HORA_INI + row;
    let estadoHojeRow = null;
    let extraHojeRow = false;
    for (let i = 0; i < 7; i++) {
      const td = refs.celulas[row][i];
      const estado = estadoCelula(horariosSemana[i], h);
      td.className = estado;
      td.textContent = "";
      // Marcar células "extra": horas Aberta que só existem por causa
      // da disponibilidade (não fariam parte do horário normal do dia).
      // Aplicam-se só a células Aberta (não Almoço, não Fechada).
      const extra = estado === "aberto" && eHoraExtra(isosSemana[i], h, calendario, dados);
      if (extra) td.classList.add("extra");
      if (isosSemana[i] === isoHoje) {
        td.classList.add("hoje");
        estadoHojeRow = estado;
        extraHojeRow = extra;
      }
    }
    refs.estadosHoje.push(estadoHojeRow);
    refs.extrasHoje.push(extraHojeRow);
  }

  // Reposicionar o relógio digital sobre a coluna do dia hoje. Usa
  // requestAnimationFrame para garantir que o browser já fez o layout
  // da tabela actualizada antes de medir as posições.
  requestAnimationFrame(() => posicionarRelogioHorario(refs));
}

// =====================================================================
// PÁGINA DE ESTATÍSTICA (/farmaciabranco/estatistica)
// Histograma da distribuição de horas de funcionamento semanal, com
// colunas clicáveis que abrem o detalhe das semanas correspondentes.
// =====================================================================

const ESTATISTICA_MESES = ["Janeiro","Fevereiro","Março","Abril","Maio",
  "Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

// Número da semana segundo a norma ISO 8601 (semana começa à segunda;
// a semana 1 é a que contém a primeira quinta-feira do ano).
function semanaISO(iso) {
  const [y, mo, d] = iso.split("-").map(Number);
  const dt = new Date(Date.UTC(y, mo - 1, d));
  const dow = (dt.getUTCDay() + 6) % 7;          // 0=Seg .. 6=Dom
  dt.setUTCDate(dt.getUTCDate() - dow + 3);       // quinta-feira da mesma semana
  const anoISO = dt.getUTCFullYear();
  const primQuinta = new Date(Date.UTC(anoISO, 0, 4));
  const dow2 = (primQuinta.getUTCDay() + 6) % 7;
  primQuinta.setUTCDate(primQuinta.getUTCDate() - dow2 + 3);
  return 1 + Math.round((dt - primQuinta) / (7 * 86400000));
}

// Dia da semana 0=Dom..6=Sáb para uma data ISO (aritmética de calendário).
function diaSemanaUTC(iso) {
  const [y, mo, d] = iso.split("-").map(Number);
  return new Date(Date.UTC(y, mo - 1, d)).getUTCDay();
}

// Formata horas: inteiro quando não há fracção; vírgula decimal (PT-PT)
// caso surja meia hora no futuro.
function fmtHorasEst(x) {
  return Number.isInteger(x) ? String(x) : x.toFixed(1).replace(".", ",");
}

// Número da semana sempre com dois dígitos (01, 02, ... 52, 53).
function fmtSemana(n) {
  return String(n).padStart(2, "0");
}

// Descreve a causa dominante do total de horas de uma semana, a partir
// da sua composição real (não do total). Conta, para cada dia, os
// eventos que afastam a semana da base de 58 h: dias de disponibilidade
// (por tipo de dia) e feriados (por tipo de dia e se foram cobertos por
// disponibilidade). Devolve uma frase curta em PT-PT.
function causaSemana(segIso, calendario, dados) {
  let nUtilDisp = 0, nSabDisp = 0, nDomDisp = 0;
  let nUtilFerFechado = 0, nSabFerFechado = 0;
  let nUtilFerAberto = 0, nSabFerAberto = 0;
  for (let i = 0; i < 7; i++) {
    const iso  = adicionarDias(segIso, i);
    const disp = eDisponibilidadeBranco(iso, dados);
    const fer  = eFeriado(iso, calendario);
    const dow  = diaSemanaUTC(iso);              // 0=Dom .. 6=Sáb
    if (dow === 0) {                              // domingo
      if (disp) nDomDisp++;                       // +10 (normal seria fechado)
    } else if (dow === 6) {                       // sábado
      if (fer) { if (disp) nSabFerAberto++; else nSabFerFechado++; }
      else if (disp) nSabDisp++;                  // +2
    } else {                                      // dia útil
      if (fer) { if (disp) nUtilFerAberto++; else nUtilFerFechado++; }
      else if (disp) nUtilDisp++;                 // +1
    }
  }
  const plural = (n, sing, plur) => (n === 1 ? sing : `${n} ${plur}`);
  const partes = [];
  if (nUtilFerFechado) partes.push(plural(nUtilFerFechado, "feriado em dia útil", "feriados em dia útil"));
  if (nSabFerFechado)  partes.push(plural(nSabFerFechado, "feriado ao sábado", "feriados ao sábado"));
  if (nDomDisp)        partes.push(plural(nDomDisp, "domingo de disponibilidade", "domingos de disponibilidade"));
  if (nSabDisp)        partes.push(plural(nSabDisp, "sábado de disponibilidade", "sábados de disponibilidade"));
  if (nSabFerAberto)   partes.push(plural(nSabFerAberto, "feriado ao sábado coberto por disponibilidade", "feriados ao sábado cobertos por disponibilidade"));
  if (nUtilDisp)       partes.push(nUtilDisp === 1 ? "1 dia útil de disponibilidade" : `${nUtilDisp} dias úteis de disponibilidade`);
  if (nUtilFerAberto)  partes.push(plural(nUtilFerAberto, "feriado em dia útil coberto por disponibilidade", "feriados em dia útil cobertos por disponibilidade"));
  const causa = partes.length ? partes.join(" + ") : "sem disponibilidade nem feriado";
  return causa.charAt(0).toUpperCase() + causa.slice(1);
}

// Constrói as semanas completas (segunda a domingo) inteiramente dentro
// do ano de referência e, para cada uma, calcula o total de horas de
// porta aberta. Devolve um array de objectos com seg, dom, total,
// número de semana ISO e etiqueta de mês.
function semanasDoAno(ano, calendario, dados) {
  const fim = `${ano}-12-31`;
  let cur = `${ano}-01-01`;
  while (diaSemanaUTC(cur) !== 1) cur = adicionarDias(cur, 1); // primeira segunda
  const semanas = [];
  while (true) {
    const dom = adicionarDias(cur, 6);
    if (dom > fim) break;                          // só semanas inteiras no ano
    let total = 0, dias = 0;
    for (let i = 0; i < 7; i++) {
      const h = horasAbertoDia(horarioBrancoDia(adicionarDias(cur, i), calendario, dados));
      total += h;
      if (h > 0) dias++;
    }
    const mSeg = Number(cur.split("-")[1]);
    const mDom = Number(dom.split("-")[1]);
    const mesLabel = mSeg === mDom
      ? ESTATISTICA_MESES[mSeg - 1]
      : `${ESTATISTICA_MESES[mSeg - 1]} / ${ESTATISTICA_MESES[mDom - 1]}`;
    semanas.push({ seg: cur, dom, total, dias, semana: semanaISO(cur), mesLabel,
                   causa: causaSemana(cur, calendario, dados) });
    cur = adicionarDias(cur, 7);
  }
  return semanas;
}

// Constrói as semanas de fronteira (a que contém 1 de Janeiro e a que
// contém 31 de Dezembro) quando atravessam a viragem do ano. As datas e
// o total são truncados aos dias dentro do ano de referência (para os
// quais há dados); o número da semana ISO usa a segunda-feira real.
// Ficam fora do histograma e das estatísticas: existem só na listagem,
// marcadas como incompletas.
function montarIncompleta(segRealIso, ano, calendario, dados) {
  const domReal = adicionarDias(segRealIso, 6);
  const ini = `${ano}-01-01`, fimAno = `${ano}-12-31`;
  const segMostra = segRealIso < ini ? ini : segRealIso;     // trunca início
  const domMostra = domReal > fimAno ? fimAno : domReal;      // trunca fim
  let total = 0, nDias = 0, dias = 0, it = segMostra;
  while (it <= domMostra) {
    const h = horasAbertoDia(horarioBrancoDia(it, calendario, dados));
    total += h;
    if (h > 0) dias++;
    nDias++;
    it = adicionarDias(it, 1);
  }
  const mSeg = Number(segMostra.split("-")[1]);
  const mDom = Number(domMostra.split("-")[1]);
  const mesLabel = mSeg === mDom
    ? ESTATISTICA_MESES[mSeg - 1]
    : `${ESTATISTICA_MESES[mSeg - 1]} / ${ESTATISTICA_MESES[mDom - 1]}`;
  const causa = `Semana incompleta; conta só os ${nDias} dias de ${ano}.`;
  return { seg: segMostra, dom: domMostra, segReal: segRealIso, total, dias, semana: semanaISO(segRealIso), mesLabel, causa, causaNota: "Não entra no histograma.", incompleta: true };
}

function semanasIncompletas(ano, calendario, dados) {
  const ini = `${ano}-01-01`, fimAno = `${ano}-12-31`;
  const out = [];
  // Semana que contém 1 de Janeiro: incompleta se começar no ano anterior.
  let segIni = ini;
  while (diaSemanaUTC(segIni) !== 1) segIni = adicionarDias(segIni, -1);
  if (segIni < ini) out.push(montarIncompleta(segIni, ano, calendario, dados));
  // Semana que contém 31 de Dezembro: incompleta se terminar no ano seguinte.
  let segFim = fimAno;
  while (diaSemanaUTC(segFim) !== 1) segFim = adicionarDias(segFim, -1);
  if (adicionarDias(segFim, 6) > fimAno) out.push(montarIncompleta(segFim, ano, calendario, dados));
  return out;
}

// Renderiza a página de estatística no body. Conteúdo estático (não
// depende da hora), calculado uma vez a partir dos JSON já carregados.
// Página de mapa: índice de todas as rotas do projecto. A parte derivada
// dos dados (meses e semanas) é gerada a partir dos mesmos JSON da
// estatística, por isso acompanha automaticamente mudanças de ano.
function renderMapa(dados, calendario, anosDisponiveis) {
  const CANON = "https://farmaciaservicoilhavoaveiro.netlify.app";
  const anoCarregado = (calendario && calendario.ano) || partesLisboa().ano;
  const anos = (anosDisponiveis && anosDisponiveis.length) ? anosDisponiveis : [anoCarregado];
  const mesesSlug = ESTATISTICA_MESES.map(n =>
    n.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""));
  const li = (url, txt, desc) =>
    `<li><a href="${url}">${txt}</a>${desc ? ` <span class="mapa-desc">${desc}</span>` : ""}</li>`;

  // Rotas fixas (não dependem de ano).
  const fixas = [
    li(`${CANON}/`, `${CANON}/`, "Site de serviço (página inicial)"),
    li(`${CANON}/farmaciabranco/horario`, `${CANON}/farmaciabranco/horario`, "Horário da semana em ecrã cheio (montra)"),
    li(`${CANON}/farmaciabranco/estatistica`, `${CANON}/farmaciabranco/estatistica`, "Estatística do ano corrente"),
    li(`${CANON}/farmaciabranco/mapa`, `${CANON}/farmaciabranco/mapa`, "Este mapa de links"),
  ].join("");

  // Uma secção por ano. Os meses não dependem dos dados (nomes fixos), por
  // isso listam-se para todos os anos. As semanas variam e exigem os dados
  // do ano; só o ano carregado os tem em memória, logo só esse lista as
  // semanas uma a uma. Para os outros anos, aponta-se à vista de ano.
  const seccoesAno = anos.map(ano => {
    const meses = ESTATISTICA_MESES.map((nome, i) =>
      li(`${CANON}/farmaciabranco/estatistica/${ano}/${mesesSlug[i]}`, nome)
    ).join("");
    let semsHTML;
    if (ano === anoCarregado) {
      const todas = semanasDoAno(ano, calendario, dados)
        .concat(semanasIncompletas(ano, calendario, dados))
        .slice().sort((a, b) => semanaISO(a.segReal || a.seg) - semanaISO(b.segReal || b.seg));
      const sems = todas.map(s => {
        const n = fmtSemana(semanaISO(s.segReal || s.seg));
        return li(`${CANON}/farmaciabranco/estatistica/${ano}/semana${n}`, `Semana ${n}`);
      }).join("");
      semsHTML = `<h3>Semanas</h3><ul class="mapa-grelha">${sems}</ul>`;
    } else {
      semsHTML = `<p class="mapa-desc">As semanas de ${ano} estão na ` +
        `<a href="${CANON}/farmaciabranco/estatistica/${ano}">vista do ano ${ano}</a>.</p>`;
    }
    return `<div class="mapa-seccao mapa-ano">` +
      `<h2>${ano}` +
        ` <a class="mapa-ano-link" href="${CANON}/farmaciabranco/estatistica/${ano}">ver ano</a></h2>` +
      `<h3>Meses</h3><ul class="mapa-grelha">${meses}</ul>` +
      semsHTML +
    `</div>`;
  }).join("");

  const overlay = document.createElement("div");
  overlay.id = "mapa-overlay";
  overlay.innerHTML =
    `<div class="mapa-caixa">` +
      `<div class="titulo"><div class="cruz"></div><div>` +
        `<div class="titulo-principal">Farmácia Branco</div>` +
        `<div class="subtitulo">Mapa de links</div>` +
      `</div></div>` +
      `<div class="mapa-seccao"><h2>Páginas principais</h2><ul>${fixas}</ul></div>` +
      seccoesAno +
      `<div class="mapa-debug-vp"></div>` +
    `</div>`;
  document.body.appendChild(overlay);
}

function renderEstatistica(dados, calendario, rotaInicial, anosDisponiveis) {
  const anoRef = (calendario && calendario.ano) || partesLisboa().ano;
  const hojeIso = isoLisboa(partesLisboa());          // para destacar a semana actual
  const semanas = semanasDoAno(anoRef, calendario, dados);
  const incompletas = semanasIncompletas(anoRef, calendario, dados);   // fronteira do ano, fora do histograma
  const todasLista = semanas.concat(incompletas);

  // Agrupar semanas por total de horas.
  const grupos = {};
  for (const s of semanas) (grupos[s.total] = grupos[s.total] || []).push(s);
  const totais = Object.keys(grupos).map(Number);
  const minH = Math.min(...totais);
  const maxH = Math.max(...totais);
  let maxFreq = 0;
  for (const t of totais) maxFreq = Math.max(maxFreq, grupos[t].length);

  // Estatísticas centrais.
  const n = semanas.length;
  const media = semanas.reduce((a, s) => a + s.total, 0) / n;
  const ord = semanas.map(s => s.total).sort((a, b) => a - b);
  const mediana = n % 2 ? ord[(n - 1) / 2] : (ord[n / 2 - 1] + ord[n / 2]) / 2;
  let moda = totais[0];
  for (const t of totais) if (grupos[t].length > grupos[moda].length) moda = t;
  const modaN = grupos[moda].length;

  // Barras: uma coluna por valor inteiro entre minH e maxH. As colunas
  // sem semanas (gaps) aparecem vazias, para o vazio ser visível.
  let barrasHTML = "";
  for (let h = minH; h <= maxH; h++) {
    const freq = grupos[h] ? grupos[h].length : 0;
    if (freq > 0) {
      const alt = Math.max(3, Math.round(freq / maxFreq * 300));
      barrasHTML +=
        `<button class="est-col" data-horas="${h}" aria-label="${h} horas, ${freq} ${freq === 1 ? "semana" : "semanas"}">` +
          `<span class="est-barra-wrap"><span class="est-valor">${freq}</span>` +
          `<span class="est-barra" style="height:${alt}px">` +
            `<span class="est-barra-vivo"><span class="est-valor-vivo"></span></span>` +
          `</span></span>` +
          `<span class="est-rotulo">${h}</span></button>`;
    } else {
      barrasHTML +=
        `<span class="est-col" aria-hidden="true">` +
          `<span class="est-barra-wrap"><span class="est-valor"></span></span>` +
          `<span class="est-rotulo">${h}</span></span>`;
    }
  }

  const overlay = document.createElement("div");
  overlay.id = "estatistica-overlay";
  // Selector de ano: só aparece se houver mais do que um ano publicado.
  // Cada ano é um link para /estatistica/AAAA; o ano corrente fica activo.
  const CANON_EST = "https://farmaciaservicoilhavoaveiro.netlify.app/farmaciabranco/estatistica";
  const listaAnos = (anosDisponiveis && anosDisponiveis.length) ? anosDisponiveis : [anoRef];
  const seletorAno = listaAnos.length > 1
    ? `<div class="est-seletor-ano">` +
        listaAnos.map(a => a === anoRef
          ? `<span class="est-ano-op ativo">${a}</span>`
          : `<a class="est-ano-op" href="${CANON_EST}/${a}">${a}</a>`).join("") +
      `</div>`
    : "";
  overlay.innerHTML =
    `<div class="est-caixa">` +
      `<div class="titulo"><div class="cruz"></div><div>` +
        `<div class="titulo-principal">Farmácia Branco</div>` +
        `<div class="subtitulo">Tempo de funcionamento - <button type="button" class="est-ano-link">${anoRef}</button></div>` +
        `<div class="subtitulo tempo-funcionamento est-topo-tf" hidden></div>` +
        seletorAno +
      `</div>` +
      `<div class="est-topo-acoes">` +
        `<a class="est-acao est-link-mapa" href="https://farmaciaservicoilhavoaveiro.netlify.app/farmaciabranco/mapa"><svg class="est-link-icone" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5 3 7v12l6-2 6 2 6-2V5l-6 2-6-2Z"/><path d="M9 5v12M15 7v12"/></svg>Mapa do Site</a>` +
        `<button type="button" class="est-acao est-voltar-tabela" hidden><svg class="est-link-icone" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 9h18M3 14h18M9 9v11"/></svg>Tabela</button>` +
        `<a class="est-acao est-link-horario" href="https://farmaciaservicoilhavoaveiro.netlify.app/farmaciabranco/horario"><svg class="est-link-icone" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 1.5"/></svg>Horário desta semana</a>` +
      `</div>` +
      `</div>` +
      `<div class="est-principal">` +
        `<div class="est-metricas">` +
          `<div class="est-metrica"><div class="rotulo">Semanas analisadas</div><div class="valor">${n}</div></div>` +
          `<div class="est-metrica"><div class="rotulo">Moda</div><div class="valor">${fmtHorasEst(moda)} h <small>(${modaN}×)</small></div></div>` +
          `<div class="est-metrica"><div class="rotulo">Mediana</div><div class="valor">${fmtHorasEst(mediana)} h</div></div>` +
          `<div class="est-metrica"><div class="rotulo">Média</div><div class="valor">${fmtHorasEst(Math.round(media * 10) / 10)} h</div></div>` +
        `</div>` +
        `<div class="est-eixo-y-titulo">Frequência (nº de semanas)</div>` +
        `<div class="est-barras" role="group" aria-label="Distribuição de horas de funcionamento por semana">${barrasHTML}</div>` +
        `<div class="est-eixo-x-titulo">Tempo de funcionamento (horas por semana)</div>` +
        `<div class="est-detalhe" aria-live="polite"></div>` +
        `<div class="est-nota">O histograma e as estatísticas contam as ${n} semanas completas (segunda a domingo) inteiramente dentro de ${anoRef}. As semanas de fronteira, que atravessam a viragem do ano, aparecem na listagem com as datas e o total truncados aos dias dentro de ${anoRef}, marcadas como incompletas; não entram no histograma nem nas estatísticas, e no respectivo horário os dias fora do ano aparecem sem dados. O total no fundo da lista soma as horas das semanas visualizadas. O número da semana segue a norma ISO 8601. As horas contam apenas tempo de porta aberta, sem almoços.</div>` +
      `</div>` +
      `<div class="est-horario-semana" hidden></div>` +
      `<div class="est-debug-vp"></div>` +
    `</div>`;
  document.body.appendChild(overlay);

  const caixa        = overlay.querySelector(".est-caixa");
  const principal    = overlay.querySelector(".est-principal");
  const detalhe      = overlay.querySelector(".est-detalhe");
  const barras       = overlay.querySelector(".est-barras");
  const vistaHorario = overlay.querySelector(".est-horario-semana");
  const linkHorario  = overlay.querySelector(".est-link-horario");
  const linkMapa     = overlay.querySelector(".est-link-mapa");
  const btnVoltar    = overlay.querySelector(".est-voltar-tabela");
  const seletorAnoEl = overlay.querySelector(".est-seletor-ano");
  const subtitulo    = overlay.querySelector(".subtitulo");
  const topoTf       = overlay.querySelector(".est-topo-tf");

  function isoBarras(iso) { return iso.replace(/-/g, "/"); }
  function ddmm(iso) { return iso.slice(8) + "/" + iso.slice(5, 7); }
  function escAttr(t) { return String(t).replace(/&/g, "&amp;").replace(/"/g, "&quot;"); }
  function limparSelecao() {
    caixa.querySelectorAll(".est-col.sel").forEach(c => {
      c.classList.remove("sel", "cheia");
      c.removeAttribute("aria-pressed");
      const v = c.querySelector(".est-barra-vivo"); if (v) v.style.height = "0";
      const nv = c.querySelector(".est-valor-vivo"); if (nv) nv.textContent = "";
      const h = c.getAttribute("data-horas");
      const f = grupos[h] ? grupos[h].length : 0;
      c.setAttribute("aria-label", `${h} horas, ${f} ${f === 1 ? "semana" : "semanas"}`);
    });
  }

  // --- Tabela de semanas: cabeçalhos ordenáveis + linhas ---------------
  const COLS = [
    { campo: "semana", rotulo: "Semana", cls: "est-h-sem" },
    { campo: "mes",    rotulo: "Mês",    cls: "est-h-mes" },
    { campo: "datas",  rotulo: "Datas",  cls: "est-h-datas" },
    { campo: "dias",   rotulo: "Dias de funcionamento", cls: "est-h-dias" },
    { campo: "horas",  rotulo: "Horas de funcionamento", cls: "est-h-horas" },
    { campo: "causa",  rotulo: "Causa",  cls: "est-h-causa" },
  ];
  const estado = { modo: "todas", tipo: null, valor: null, lista: semanas.slice(), campo: "semana", asc: true };

  function comparar(a, b) {
    const dir = estado.asc ? 1 : -1;
    if (estado.campo === "semana") return dir * (a.semana - b.semana);
    if (estado.campo === "horas")  return dir * (a.total - b.total);
    if (estado.campo === "dias")   return dir * (a.dias - b.dias);
    if (estado.campo === "causa")  return dir * a.causa.localeCompare(b.causa, "pt");
    return dir * (a.seg < b.seg ? -1 : a.seg > b.seg ? 1 : 0); // mês/datas: cronológico
  }
  function headHTML() {
    return `<div class="est-lista-head">` + COLS.map(c => {
      const activo = estado.campo === c.campo;
      const seta = activo ? (estado.asc ? "▲" : "▼") : "";
      return `<button type="button" class="est-th ${c.cls}${activo ? " activo" : ""}" data-campo="${c.campo}">` +
             `${c.rotulo}<span class="est-seta">${seta}</span></button>`;
    }).join("") + `</div>`;
  }
  function itemSemana(s) {
    const segHorario = s.segReal || s.seg;
    const domReal = adicionarDias(segHorario, 6);
    const atual = hojeIso >= segHorario && hojeIso <= domReal;     // semana que contém hoje
    const horas = s.total == null ? `n/d` : `${fmtHorasEst(s.total)} h`;
    const causaHtml = s.causaNota
      ? `${s.causa}<span class="est-causa-nota">${s.causaNota}</span>`
      : s.causa;
    const cls = [s.incompleta ? "inc" : "", atual ? "atual" : ""].filter(Boolean).join(" ");
    // Nas linhas completas, as células de dias, horas e causa são botões
    // que filtram a listagem por esse critério. As incompletas ficam fora
    // do universo do histograma, por isso mantêm-se como texto.
    const filtravel = !s.incompleta;
    // Célula do mês: um link por mês que a etiqueta mostra. Nos meses
    // compostos há dois links, um para cada mês.
    const mSeg = Number(s.seg.split("-")[1]);
    const mDom = Number(s.dom.split("-")[1]);
    const linkMes = (mes) => `<button type="button" class="est-mes-btn" data-fmes="${mes}" aria-label="Ver horários de ${ESTATISTICA_MESES[mes - 1]} de ${anoRef}">${ESTATISTICA_MESES[mes - 1]}</button>`;
    const celMes = mSeg === mDom
      ? `<span class="est-mes">${linkMes(mSeg)}</span>`
      : `<span class="est-mes">${linkMes(mSeg)} / ${linkMes(mDom)}</span>`;
    const celDias = filtravel
      ? `<button type="button" class="est-dias est-filtro" data-ftipo="dias" data-fvalor="${s.dias}">${s.dias}</button>`
      : `<span class="est-dias">${s.dias == null ? "n/d" : s.dias}</span>`;
    const celHoras = filtravel
      ? `<button type="button" class="est-horas est-filtro" data-ftipo="horas" data-fvalor="${s.total}">${horas}</button>`
      : `<span class="est-horas">${horas}</span>`;
    const celCausa = filtravel
      ? `<button type="button" class="est-causa est-filtro" data-ftipo="causa" data-fvalor="${escAttr(s.causa)}">${causaHtml}</button>`
      : `<span class="est-causa">${causaHtml}</span>`;
    return `<li${cls ? ` class="${cls}"` : ``}>` +
      `<button type="button" class="est-sem" data-seg="${segHorario}">Semana ${fmtSemana(s.semana)}</button>` +
      celMes +
      `<button type="button" class="est-datas est-datas-btn" data-seg="${segHorario}">${isoBarras(s.seg)} a ${isoBarras(s.dom)}</button>` +
      celDias +
      celHoras +
      celCausa +
      `</li>`;
  }
  function renderTabela() {
    const lista = estado.lista.slice().sort(comparar);
    const soma = lista.reduce((acc, s) => acc + (s.total || 0), 0);
    const somaDias = lista.reduce((acc, s) => acc + (s.dias || 0), 0);
    const causaTotal = lista.some(s => s.incompleta) ? "As semanas incompletas são consideradas" : "";
    // Intervalo de datas na linha total só no modo "todas": aí a lista é
    // contígua e cobre o ano inteiro (as incompletas tocam 01/01 e 31/12).
    // Nos filtros, as semanas podem não ser contíguas, por isso fica vazio.
    let datasTotal = "";
    if (estado.modo === "todas" && lista.length) {
      const minSeg = lista.reduce((a, s) => (s.seg < a ? s.seg : a), lista[0].seg);
      const maxDom = lista.reduce((a, s) => (s.dom > a ? s.dom : a), lista[0].dom);
      datasTotal = `${isoBarras(minSeg)} a ${isoBarras(maxDom)}`;
    }
    const totalLabel = estado.modo === "todas"
      ? `<button type="button" class="est-ano-link">Total</button> (${lista.length} ${lista.length === 1 ? "semana" : "semanas"})`
      : `Total (${lista.length} ${lista.length === 1 ? "semana" : "semanas"})`;
    const linhaTotal =
      `<li class="est-total-row">` +
        `<span class="est-total-label">${totalLabel}</span>` +
        `<span class="est-total-datas">${datasTotal}</span>` +
        `<span class="est-total-dias">${somaDias}</span>` +
        `<span class="est-total-horas">${fmtHorasEst(soma)} h</span>` +
        `<span class="est-total-causa">${causaTotal}</span>` +
      `</li>`;
    detalhe.querySelector(".est-tabela").innerHTML =
      headHTML() + `<ul class="est-lista">${lista.map(itemSemana).join("") + linhaTotal}</ul>`;
  }
  function aplicarVista() {
    let cab;
    if (estado.modo === "todas") {
      const ni = incompletas.length;
      const detalheInc = ni ? ` (${semanas.length} completas + ${ni} ${ni === 1 ? "incompleta" : "incompletas"})` : ``;
      cab = `<div class="est-detalhe-cab">Todas as semanas · ${todasLista.length}${detalheInc}</div>`;
    } else {
      const nF = estado.lista.length;
      let crit;
      if (estado.tipo === "horas")     crit = `${fmtHorasEst(estado.valor)} h`;
      else if (estado.tipo === "dias") crit = `${estado.valor} ${estado.valor === 1 ? "dia de funcionamento" : "dias de funcionamento"}`;
      else                             crit = estado.valor;
      cab = `<div class="est-detalhe-cab">${crit} · ${nF} ${nF === 1 ? "semana" : "semanas"}` +
            `<button type="button" class="est-btn-todas">Considerar todas</button></div>`;
    }
    detalhe.innerHTML = cab + `<div class="est-tabela"></div>`;
    renderTabela();
  }

  function mostrarTodas(push = true) {
    barras.classList.remove("modo-foco");
    limparSelecao();
    estado.modo = "todas"; estado.tipo = null; estado.valor = null; estado.lista = todasLista.slice();
    aplicarVista();
    if (push) definirURL("");
  }
  // Lista de semanas completas que satisfazem o critério.
  function listaFiltrada(tipo, valor) {
    if (tipo === "horas") return semanas.filter(s => s.total === valor);
    if (tipo === "dias")  return semanas.filter(s => s.dias === valor);
    if (tipo === "causa") return semanas.filter(s => s.causa === valor);
    return semanas.slice();
  }
  // Realça no histograma as colunas de horas presentes na lista filtrada.
  // Mantém a altura global da barra; desenha por cima, ancorada ao fundo,
  // a fracção que obedece ao critério (cor viva), deixando o resto baço.
  function realcarHistograma(lista) {
    limparSelecao();
    const contagem = {};
    lista.forEach(s => { contagem[s.total] = (contagem[s.total] || 0) + 1; });
    Object.keys(contagem).forEach(h => {
      const col = caixa.querySelector(`.est-col[data-horas="${h}"]`);
      if (!col) return;
      const total = grupos[h] ? grupos[h].length : 0;
      const filtrado = contagem[h];
      col.classList.add("sel");
      col.setAttribute("aria-pressed", "true");
      if (filtrado >= total) col.classList.add("cheia");
      const vivo = col.querySelector(".est-barra-vivo");
      const numVivo = col.querySelector(".est-valor-vivo");
      if (vivo) vivo.style.height = total ? (filtrado / total * 100) + "%" : "0";
      if (numVivo) numVivo.textContent = filtrado;
      col.setAttribute("aria-label",
        `${h} horas, ${filtrado} de ${total} ${total === 1 ? "semana corresponde" : "semanas correspondem"} ao filtro`);
    });
  }
  function aplicarFiltro(tipo, valor) {
    barras.classList.add("modo-foco");
    estado.modo = "foco"; estado.tipo = tipo; estado.valor = valor;
    estado.lista = listaFiltrada(tipo, valor);
    realcarHistograma(estado.lista);
    aplicarVista();
  }

  // --- Vistas de horário (semana e mês) --------------------------------
  // Gera a tabela de horário de uma semana. Marca como "fora" (esbatido)
  // os dias fora do ano e, quando mesFiltro é dado, os dias de outro mês.
  // comColunaHora: true = sempre visível; false = ausente;
  // "toggle" = presente mas ocultável por CSS (classe est-col-hora),
  // para a vista de mês a mostrar só na 1ª tira de cada fila.
  function tabelaHorarioSemanaHTML(segIso, comColunaHora = true, mesFiltro = null) {
    const iniAno = `${anoRef}-01-01`, fimAno = `${anoRef}-12-31`;
    const isos = [];
    for (let i = 0; i < 7; i++) isos.push(adicionarDias(segIso, i));
    const fora = isos.map(iso =>
      iso < iniAno || iso > fimAno || (mesFiltro != null && Number(iso.split("-")[1]) !== mesFiltro));
    const haFora = fora.some(Boolean);
    const clsHora = comColunaHora === "toggle" ? ` class="est-col-hora"` : ``;
    const temHora = comColunaHora === true || comColunaHora === "toggle";
    let cab = temHora ? `<th${clsHora}>Hora</th>` : ``;
    for (let i = 0; i < 7; i++) {
      cab += `<th class="${fora[i] ? "fora" : ""}"><span class="dia">${HORARIO_DIAS_NOMES[i]}</span><span class="data">${ddmm(isos[i])}</span></th>`;
    }
    let corpo = "";
    for (let hh = HORARIO_HORA_INI; hh < HORARIO_HORA_FIM; hh++) {
      let tds = temHora ? `<th class="hora${comColunaHora === "toggle" ? " est-col-hora" : ""}">${String(hh).padStart(2, "0")}h-${String(hh + 1).padStart(2, "0")}h</th>` : ``;
      for (let i = 0; i < 7; i++) {
        if (fora[i]) { tds += `<td class="hs-fora">—</td>`; continue; }
        const horario = horarioBrancoDia(isos[i], calendario, dados);
        const est = estadoCelula(horario, hh);
        let cls = "fechado", txt = "";
        if (est === "aberto") {
          cls = eHoraExtra(isos[i], hh, calendario, dados) ? "extra" : "aberto";
          txt = "Aberta";
        } else if (est === "almoco") { cls = "almoco"; txt = "Almoço"; }
        tds += `<td class="hs-${cls}">${txt}</td>`;
      }
      corpo += `<tr>${tds}</tr>`;
    }
    return { tabela: `<table class="est-tab-horario"><thead><tr>${cab}</tr></thead><tbody>${corpo}</tbody></table>`, haFora, domIso: isos[6] };
  }
  function legendaHorarioHTML(haFora, rotuloFora) {
    return `<div class="est-hs-legenda">` +
        `<span><i class="leg leg-aberto"></i>Aberta</span>` +
        `<span><i class="leg leg-extra"></i>Aberta (alargado)</span>` +
        `<span><i class="leg leg-almoco"></i>Almoço</span>` +
        `<span><i class="leg leg-fechado"></i>Fechada</span>` +
        (haFora ? `<span><i class="leg leg-fora"></i>${rotuloFora || "Fora do ano (sem dados)"}</span>` : ``) +
      `</div>`;
  }
  // Métricas do mês contadas dia a dia (de calendário), não por semana,
  // para as semanas de fronteira não duplicarem: total de horas de porta
  // aberta e número de dias com pelo menos uma hora aberta.
  function metricasDoMes(mes) {
    let horas = 0, dias = 0;
    let it = `${anoRef}-${String(mes).padStart(2, "0")}-01`;
    while (Number(it.split("-")[1]) === mes) {
      const hd = horasAbertoDia(horarioBrancoDia(it, calendario, dados));
      horas += hd;
      if (hd > 0) dias += 1;
      it = adicionarDias(it, 1);
    }
    return { horas, dias };
  }
  function horasDoMes(mes) { return metricasDoMes(mes).horas; }
  function metricasDoAno() {
    let horas = 0, dias = 0;
    for (let m = 1; m <= 12; m++) { const x = metricasDoMes(m); horas += x.horas; dias += x.dias; }
    return { horas, dias };
  }
  function horasDoAno() { return metricasDoAno().horas; }
  // Texto da linha de métricas (dias + horas) a partir de valores soltos.
  function textoMetricas(dias, horas) {
    return `Dias de funcionamento: ${dias} ${dias === 1 ? "dia" : "dias"}` +
      `&nbsp;&nbsp;Horas de funcionamento: ${fmtHorasEst(horas)} h`;
  }
  // Texto da linha de métricas (dias + horas) usado nos cabeçalhos de mês.
  function textoMetricasMes(mes) {
    const m = metricasDoMes(mes);
    return textoMetricas(m.dias, m.horas);
  }
  // Semanas (completas e incompletas) que tocam o mês, isto é, cuja janela
  // de 7 dias real intersecta o intervalo do mês. Uma semana de fronteira
  // aparece nos dois meses que toca.
  function semanasDoMes(mes) {
    const ini = `${anoRef}-${String(mes).padStart(2, "0")}-01`;
    let fim = ini;
    while (Number(adicionarDias(fim, 1).split("-")[1]) === mes) fim = adicionarDias(fim, 1);
    return todasLista
      .filter(s => { const seg = s.segReal || s.seg; return seg <= fim && adicionarDias(seg, 6) >= ini; })
      .sort((a, b) => { const A = a.segReal || a.seg, B = b.segReal || b.seg; return A < B ? -1 : A > B ? 1 : 0; });
  }
  function htmlHorarioSemana(segIso) {
    const { tabela, haFora } = tabelaHorarioSemanaHTML(segIso);
    return legendaHorarioHTML(haFora) + tabela;
  }
  // Tiras de horário de um mês (uma por semana que o toca), em modo
  // toggle. Devolve o HTML das tiras e se há dias esbatidos.
  function tirasDoMesHTML(mes) {
    const sems = semanasDoMes(mes);
    let haFora = false;
    const blocos = sems.map((s) => {
      const seg = s.segReal || s.seg;
      const r = tabelaHorarioSemanaHTML(seg, "toggle", mes);
      if (r.haFora) haFora = true;
      const dom = adicionarDias(seg, 6);
      return `<div class="est-mes-bloco">` +
        `<div class="est-mes-bloco-tit">Semana ${fmtSemana(semanaISO(seg))}<span>${isoBarras(seg)} a ${isoBarras(dom)}</span></div>` +
        r.tabela + `</div>`;
    });
    return { html: `<div class="est-mes-tiras">${blocos.join("")}</div>`, haFora };
  }
  function htmlHorarioMes(mes) {
    const { html, haFora } = tirasDoMesHTML(mes);
    return legendaHorarioHTML(haFora, "Dia de outro mês") + html;
  }
  // Vista de ano: o ano inteiro, uma faixa por mês. Cada faixa tem o nome
  // do mês e o total mensal, e as suas tiras quebram dentro da própria
  // faixa (ex.: Novembro), sem invadir o mês seguinte.
  function htmlHorarioAno() {
    let haForaQualquer = false;
    const faixas = ESTATISTICA_MESES.map((nome, i) => {
      const mes = i + 1;
      const { html, haFora } = tirasDoMesHTML(mes);
      if (haFora) haForaQualquer = true;
      return `<div class="est-ano-faixa">` +
        `<div class="est-ano-mes-cab">` +
          `<div class="est-ano-mes-nome">${nome} de ${anoRef}</div>` +
          `<div class="tempo-funcionamento est-ano-mes-met">${textoMetricasMes(mes)}</div>` +
        `</div>` +
        html + `</div>`;
    });
    return legendaHorarioHTML(haForaQualquer, "Dia de outro mês") +
      faixas.join("");
  }
  function abrirHorarioAno(push = true) {
    overlay.classList.add("vista-mes", "vista-ano");   // vista-mes alarga a caixa; vista-ano marca o modo
    if (subtitulo) subtitulo.textContent = `Horário do ano - ${anoRef}`;
    if (topoTf) { topoTf.hidden = false; const a = metricasDoAno(); topoTf.innerHTML = textoMetricas(a.dias, a.horas); }
    vistaHorario.innerHTML = htmlHorarioAno();
    principal.hidden = true;
    vistaHorario.hidden = false;
    if (linkHorario) linkHorario.style.display = "";   // horário desta semana: destino fixo
    if (linkMapa) linkMapa.style.display = "";   // mapa visível na vista de ano
    if (btnVoltar) btnVoltar.hidden = false;
    if (seletorAnoEl) seletorAnoEl.style.display = "";   // seletor visível no ano
    overlay.scrollTop = 0;
    ajustarColunasHoraMes();
    if (push) definirURL(String(anoRef));
  }
  function abrirHorarioSemana(segIso, push = true) {
    overlay.classList.remove("vista-mes", "vista-ano");
    const s = todasLista.find(x => (x.segReal || x.seg) === segIso);
    const atual = hojeIso >= segIso && hojeIso <= adicionarDias(segIso, 6);
    if (subtitulo) subtitulo.textContent = `Semana ${fmtSemana(semanaISO(segIso))} - Horário`;
    if (topoTf) {
      topoTf.hidden = false;
      const horasTxt = s ? fmtHorasEst(s.total) : "n/d";
      const diasTxt = s && s.dias != null ? `${s.dias} ${s.dias === 1 ? "dia" : "dias"}` : "n/d";
      topoTf.innerHTML = `Dias de funcionamento: ${diasTxt}&nbsp;&nbsp;Horas de funcionamento: ${horasTxt} h`;
    }
    vistaHorario.innerHTML = htmlHorarioSemana(segIso);
    principal.hidden = true;
    vistaHorario.hidden = false;
    if (linkHorario) linkHorario.style.display = "";   // horário desta semana: destino fixo, sempre disponível
    if (linkMapa) linkMapa.style.display = "";   // mapa visível nas vistas de semana
    if (btnVoltar) btnVoltar.hidden = false;
    if (seletorAnoEl) seletorAnoEl.style.display = "none";   // semana é de ano fixo
    overlay.scrollTop = 0;
    if (push) definirURL(`${anoRef}/semana${fmtSemana(semanaISO(segIso))}`);
  }
  // Mostra a coluna de horas apenas na primeira tira de cada fila visual.
  // Opera por faixa (.est-mes-tiras): cada faixa é tratada de forma
  // independente, o que cobre tanto a vista de um mês (uma faixa) como a
  // vista de ano (uma faixa por mês). Recalcula no resize.
  function ajustarColunasHoraMes() {
    if (!overlay.classList.contains("vista-mes") && !overlay.classList.contains("vista-ano")) return;
    vistaHorario.querySelectorAll(".est-mes-tiras").forEach((faixa) => {
      let topoAnt = null;
      faixa.querySelectorAll(".est-mes-bloco").forEach((t) => {
        const topo = t.offsetTop;
        const primeiraDaFila = topoAnt === null || topo > topoAnt + 1;   // tolerância de 1px
        t.classList.toggle("com-hora", primeiraDaFila);
        topoAnt = topo;
      });
    });
  }
  function abrirHorarioMes(mes, push = true) {
    overlay.classList.remove("vista-ano");
    overlay.classList.add("vista-mes");
    if (subtitulo) subtitulo.innerHTML = `Horário do mês - <button type="button" class="est-ano-link">${anoRef}</button>/${String(mes).padStart(2, "0")}`;
    if (topoTf) { topoTf.hidden = false; topoTf.innerHTML = textoMetricasMes(mes); }
    vistaHorario.innerHTML = htmlHorarioMes(mes);
    principal.hidden = true;
    vistaHorario.hidden = false;
    if (linkHorario) linkHorario.style.display = "";   // horário visível na vista de mês
    if (linkMapa) linkMapa.style.display = "";         // mapa visível na vista de mês
    if (btnVoltar) btnVoltar.hidden = false;
    if (seletorAnoEl) seletorAnoEl.style.display = "none";   // mês é de ano fixo
    overlay.scrollTop = 0;
    ajustarColunasHoraMes();   // depois de inserido no DOM, já há posições para medir
    if (push) definirURL(`${anoRef}/${MESES_SLUG[mes - 1]}`);
  }
  // --- Roteamento por URL ---------------------------------------------
  // Mapeia vistas para sub-rotas de /farmaciabranco/estatistica e vice-
  // versa, com hierarquia ano / mês ou semana. pushState mantém a barra
  // de endereço sincronizada com a vista. O nome do mês vai sem acentos.
  const EST_BASE = "/farmaciabranco/estatistica";
  const MESES_SLUG = ESTATISTICA_MESES.map(n =>
    n.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""));
  function definirURL(sub) {
    const novo = EST_BASE + (sub ? "/" + sub : "");
    if (location.pathname !== novo) history.pushState({ estSub: sub || "" }, "", novo);
  }
  // Abre a vista correspondente a uma sub-rota (sem mexer no URL).
  function aplicarRota(sub) {
    if (!sub) { mostrarTodas(false); return; }
    const partes = sub.split("/");                 // ["2026"] | ["2026","janeiro"] | ["2026","semana01"]
    if (partes[0] !== String(anoRef)) { mostrarTodas(false); return; }   // ano diferente: cai na tabela
    const alvo = partes[1] || "";
    if (alvo === "") { abrirHorarioAno(false); return; }
    if (/^semana\d{1,2}$/.test(alvo)) {
      const n = Number(alvo.replace("semana", ""));
      const s = todasLista.find(x => semanaISO(x.segReal || x.seg) === n);
      if (s) { abrirHorarioSemana(s.segReal || s.seg, false); return; }
    }
    const idxMes = MESES_SLUG.indexOf(alvo);
    if (idxMes >= 0) { abrirHorarioMes(idxMes + 1, false); return; }
    mostrarTodas(false);   // rota desconhecida: cai na tabela
  }
  function voltarTabela() {
    overlay.classList.remove("vista-mes", "vista-ano");
    if (subtitulo) subtitulo.innerHTML = `Tempo de funcionamento - <button type="button" class="est-ano-link">${anoRef}</button>`;
    if (topoTf) topoTf.hidden = true;
    vistaHorario.hidden = true;
    principal.hidden = false;
    if (linkHorario) linkHorario.style.display = "";       // repõe o valor do stylesheet (inline-block)
    if (linkMapa) linkMapa.style.display = "";             // mapa visível na listagem
    if (btnVoltar) btnVoltar.hidden = true;                // sem detalhe aberto, não há "Voltar à tabela"
    if (seletorAnoEl) seletorAnoEl.style.display = "";     // seletor visível na listagem
    definirURL("");
  }

  // --- Eventos ---------------------------------------------------------
  window.addEventListener("resize", ajustarColunasHoraMes);
  barras.addEventListener("click", (e) => {
    const col = e.target.closest(".est-col[data-horas]");
    if (!col) return;
    const h = Number(col.getAttribute("data-horas"));
    if (estado.modo === "foco" && estado.tipo === "horas" && estado.valor === h) mostrarTodas(); // interruptor
    else aplicarFiltro("horas", h);
  });
  detalhe.addEventListener("click", (e) => {
    const th = e.target.closest(".est-th");
    if (th) {
      const campo = th.getAttribute("data-campo");
      if (estado.campo === campo) estado.asc = !estado.asc;
      else { estado.campo = campo; estado.asc = true; }
      renderTabela();
      return;
    }
    if (e.target.closest(".est-ano-link")) { abrirHorarioAno(); return; }
    if (e.target.closest(".est-btn-todas")) { mostrarTodas(); return; }
    const cel = e.target.closest(".est-filtro");
    if (cel) {
      const tipo = cel.getAttribute("data-ftipo");
      let valor = cel.getAttribute("data-fvalor");
      if (tipo === "horas" || tipo === "dias") valor = Number(valor);
      if (estado.modo === "foco" && estado.tipo === tipo && estado.valor === valor) mostrarTodas(); // interruptor
      else aplicarFiltro(tipo, valor);
      return;
    }
    const mesBtn = e.target.closest(".est-mes-btn[data-fmes]");
    if (mesBtn) { abrirHorarioMes(Number(mesBtn.getAttribute("data-fmes"))); return; }
    const sem = e.target.closest(".est-sem[data-seg], .est-datas-btn[data-seg]");
    if (sem) { abrirHorarioSemana(sem.getAttribute("data-seg")); return; }
  });
  const acoesTopo = overlay.querySelector(".est-topo-acoes");
  if (acoesTopo) acoesTopo.addEventListener("click", (e) => {
    if (e.target.closest(".est-voltar-tabela")) voltarTabela();
  });
  if (subtitulo) subtitulo.addEventListener("click", (e) => {
    if (e.target.closest(".est-ano-link")) abrirHorarioAno();
  });

  // Estado inicial: aplica a sub-rota do URL (ano, mês ou semana) ou,
  // na sua ausência, a tabela com todas as semanas. Sem push: o arranque
  // não deve criar uma entrada extra no histórico.
  if (rotaInicial) aplicarRota(rotaInicial);
  else mostrarTodas(false);
  // Substitui a entrada inicial por uma com estado, para o "voltar" do
  // browser ter um ponto de partida coerente.
  history.replaceState({ estSub: rotaInicial || "" }, "", location.pathname);
  // Botão voltar/avançar do browser: reaplica a vista da sub-rota, sem
  // voltar a empilhar no histórico.
  window.addEventListener("popstate", () => {
    const m = location.pathname.match(/^\/farmaciabranco\/estatistica(?:\/(.*))?\/?$/);
    aplicarRota(m && m[1] ? m[1].replace(/\/$/, "") : "");
  });
}

(async () => {

  // escondem o Linktree). As rotas /farmaciabranco/* (horário e
  // estatística) exibem a marca Farmácia Branco e não devem aparecer
  // nesses domínios. Se uma dessas rotas for aberta aqui, redirecciona
  // para a raiz do próprio domínio (site de serviço genérico, sem marca
  // Branco), antes de criar qualquer overlay. location.replace não
  // polui o histórico de navegação.
  if (HOSTNAMES_SEM_LINKTREE.includes(location.hostname)
      && /^\/farmaciabranco\//.test(location.pathname)) {
    location.replace("/");
    return;
  }

  // Configura o QR "Você está aqui", o link respectivo, e a visibilidade
  // do Linktree, com base no URL onde a página está a correr. Permite
  // ter múltiplos sites (Netlify) a servir o mesmo index.html com
  // comportamentos diferentes, sem branching de código.
  aplicarConfigPorHostname();

  // Modo montra: a TV2 da montra mostra o site principal (mesmo URL "/"
  // que um visitante normal). O parâmetro ?montra=1 marca o body com a
  // classe "modo-montra", usada apenas para esconder elementos só-web
  // que não fazem sentido num display físico de montra (ex.: a nota
  // legal "Chamada para a rede fixa nacional", obrigatória no sítio da
  // Internet mas não num ecrã visto da rua). NÃO afecta visitantes.
  if (new URLSearchParams(location.search).has("montra")) {
    document.body.classList.add("modo-montra");
  }

  // Inicializa o overlay do horário (criado no DOM apenas se ?horario=1
  // estiver presente na URL). Quando activo, ocupa o ecrã todo de forma
  // permanente — caso de uso: TV dedicada ao horário semanal.
  const horarioRefs    = inicializarHorario();
  const temHorario     = !!horarioRefs;

  // Página de estatística: activa-se pelo pathname, à imagem do horário.
  // Aceita a raiz /estatistica e sub-rotas /estatistica/<algo> (ano, mês
  // ou semana), que abrem directamente a vista correspondente.
  const mEst = location.pathname.match(/^\/farmaciabranco\/estatistica(?:\/(.*))?\/?$/);
  const estatisticaAtiva = !!mEst;
  const estatisticaRota = mEst && mEst[1] ? mEst[1].replace(/\/$/, "") : "";
  // Página de mapa: índice de rotas. Activa-se pelo pathname.
  const mapaAtivo = /^\/farmaciabranco\/mapa\/?$/.test(location.pathname);

  // Cor cinzenta dos setores decorridos (centralizada em COR_DECORRIDO).
  dom.setorDecorrido.setAttribute("fill", COR_DECORRIDO);
  dom.setorDispDecorrido.setAttribute("fill", COR_DECORRIDO);

  gerarMarcacoesRelogio();
  atualizarRelogio();

  // ---------------------------------------------------------------------
  // Diagnóstico de viewport: linha permanente no footer + overlay opcional.
  // O overlay activa-se com ?debug=1 na URL. Útil quando o footer não
  // está visível (ex.: TV a cair em fallback). Actualiza no resize.
  // ---------------------------------------------------------------------
  function nomeBreakpointActivo() {
    if (matchMedia("(min-width: 1800px) and (min-height: 500px)").matches) return "TV";
    if (matchMedia("(min-width: 1280px) and (max-width: 1799px) and (min-height: 500px)").matches) return "grande";
    if (matchMedia("(min-width: 1024px) and (max-width: 1279px) and (min-height: 500px)").matches) return "médio";
    if (matchMedia("(min-width: 900px) and (min-height: 500px)").matches) return "base";
    return "fallback";
  }
  function infoViewport() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;
    return `${w}×${h} dpr:${dpr} mq:${nomeBreakpointActivo()}`;
  }
  function atualizarDebugViewport() {
    const txt = infoViewport();
    dom.updateDebug.textContent = txt;
    dom.debugVp.textContent = txt;
    if (horarioRefs && horarioRefs.debugViewport) {
      horarioRefs.debugViewport.textContent = txt;
    }
    const estDbg = document.querySelector("#estatistica-overlay .est-debug-vp");
    if (estDbg) estDbg.textContent = txt;
    const mapaDbg = document.querySelector("#mapa-overlay .mapa-debug-vp");
    if (mapaDbg) mapaDbg.textContent = txt;
  }
  if (new URLSearchParams(location.search).has("debug")) {
    dom.debugVp.classList.add("on");
  }
  atualizarDebugViewport();
  window.addEventListener("resize", atualizarDebugViewport);
  // Reposicionar o relógio do horário quando o viewport muda (a
  // largura das colunas da tabela varia).
  window.addEventListener("resize", () => {
    if (horarioRefs) posicionarRelogioHorario(horarioRefs);
  });

  // ---------------------------------------------------------------------
  // Selecção do ano (site multi-ano).
  // - O ano corrente vem da data de Lisboa; serve a página principal e a TV.
  // - A estatística/mapa podem pedir um ano específico pelo URL.
  // - anos.json lista os anos publicados. Se o ano pedido não existir,
  //   recua-se para o mais próximo disponível (último <= pedido, ou o
  //   primeiro da lista), para o site nunca ficar vazio.
  // ---------------------------------------------------------------------
  const anosDisponiveis = await carregarAnos();
  const anoCorrente = partesLisboa().ano;
  // Ano pedido pelo URL da estatística (primeiro segmento da sub-rota).
  const anoPedidoURL = (estatisticaAtiva && estatisticaRota)
    ? parseInt(estatisticaRota.split("/")[0], 10) : NaN;
  function resolverAno(pretendido) {
    if (!anosDisponiveis.length) return pretendido;          // sem índice: tenta o pretendido
    if (anosDisponiveis.includes(pretendido)) return pretendido;
    const menores = anosDisponiveis.filter(a => a <= pretendido);
    return menores.length ? menores[menores.length - 1] : anosDisponiveis[0];
  }
  // Ano a carregar: o do URL se for um número válido, senão o corrente.
  const anoAlvo = resolverAno(Number.isFinite(anoPedidoURL) ? anoPedidoURL : anoCorrente);

  // Carrega farmacias-AAAA.json e calendario-AAAA.json do ano alvo.
  const [dados, calendario] = await Promise.all([
    carregarDados(anoAlvo),
    carregarCalendario(anoAlvo),
  ]);

  if (!dados) {
    setInterval(() => {
      const p = partesLisboa();
      atualizarRelogio(p);
    }, 1000);
    return;
  }
  tick(dados);

  // Página de estatística: render único após carregar dados.
  if (estatisticaAtiva && calendario) {
    renderEstatistica(dados, calendario, estatisticaRota, anosDisponiveis);
    atualizarDebugViewport();
  }

  // Página de mapa: índice de rotas, render único após carregar dados.
  if (mapaAtivo && calendario) {
    renderMapa(dados, calendario, anosDisponiveis);
    atualizarDebugViewport();
  }

  // Virada de ano: a TV/página principal carrega o ano corrente e mantém-
  // se aberta. Quando a data passa para um ano novo (ex.: meia-noite de 1
  // de Janeiro), os dados em memória ficam do ano anterior. Se estivermos
  // a mostrar o ano corrente (não um arquivo escolhido por URL), e a data
  // mudar de ano, recarrega-se a página para apanhar o ano novo. Só se
  // aplica fora das vistas de estatística/mapa com ano fixado no URL.
  const aMostrarAnoCorrente = !Number.isFinite(anoPedidoURL);
  function verificarViradaDeAno(p) {
    if (!aMostrarAnoCorrente) return;
    if (p.ano !== anoAlvo) location.reload();
  }

  // Estado de população da tabela do horário: registamos o dia do
  // último redraw para repopular só quando muda de dia (à meia-noite).
  let ultimoDiaPopulado = null;
  function repopularSeMudarDia(p) {
    if (!horarioRefs || !calendario) return;
    const iso = `${p.ano}-${String(p.mes).padStart(2,"0")}-${String(p.dia).padStart(2,"0")}`;
    if (iso !== ultimoDiaPopulado) {
      popularTabelaHorario(horarioRefs, calendario, dados, p);
      ultimoDiaPopulado = iso;
    }
  }
  // Primeira população imediata.
  repopularSeMudarDia(partesLisboa());
  if (horarioRefs) tickEstadoHoje(horarioRefs, partesLisboa());

  // Cada tick: 1 chamada a partesLisboa() partilhada entre todos os
  // componentes (garante coerência temporal).
  setInterval(() => {
    const p = partesLisboa();
    verificarViradaDeAno(p);
    tick(dados, p);
    atualizarRelogio(p);
    repopularSeMudarDia(p);
    if (horarioRefs) {
      atualizarRelogioHorario(horarioRefs, p);
      tickEstadoHoje(horarioRefs, p);
    }
  }, 1000);
})();

</script>

</body>
