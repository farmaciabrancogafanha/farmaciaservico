<style>
body { font-family: Arial, sans-serif; margin: 0; background: #eef2f3; }

.container {
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  padding:20px;
}

.coluna-wrapper {
  flex:1;
  min-width:320px;
  display:flex;
  flex-direction:column;
}

.coluna {
  background:white;
  padding:20px;
  border-radius:12px;
  flex:1;
}

.cruz {
  width:44px;height:44px;background:#2e7d32;position:relative;border-radius:6px;
}
.cruz::before,.cruz::after{content:"";position:absolute;background:white;}
.cruz::before{width:70%;height:12px;top:50%;left:15%;transform:translateY(-50%);}
.cruz::after{height:70%;width:12px;left:50%;top:15%;transform:translateX(-50%);}

.titulo { display:flex; gap:12px; border-bottom:2px solid #2e7d32; margin-bottom:10px; }
.titulo-principal { font-size:32px; font-weight:bold; }
.subtitulo { font-size:24px; color:#555; }
.tempo-funcionamento,
.tempo-funcionamento:link,
.tempo-funcionamento:visited,
.tempo-funcionamento:hover,
.tempo-funcionamento:active { color:#777; font-weight:normal; text-decoration:none; }
.horario-link-est,
.horario-link-est:link,
.horario-link-est:visited,
.horario-link-est:hover,
.horario-link-est:active { color:inherit; text-decoration:none; }

/* TEXTO UNIFORME */
.texto, .sub-bloco, .sub-bloco small, .farmacia {
  font-size:20px;
  line-height:1.5;
}

.sub-bloco {
  margin-bottom:15px;
  padding-left:10px;
  border-left:4px solid #2e7d32;
  font-weight:bold;
}

.sub-bloco small {
  display:block;
  font-weight:bold;
}

mark {
  background:#fff59d;
  padding:0 4px;
  border-radius:3px;
  font-weight:bold;
}

.data-turno {
  background:#bbdefb;
  padding:0 4px;
  border-radius:3px;
  font-weight:bold;
}

.farmacia {
  margin:12px 0;
  padding:10px;
  border-left:4px solid #2e7d32;
  background:#f9fbf9;
}

.nome { font-weight:bold; }

/* Botão de ação (mapa, ligar) — chip verde claro inline */
.botao-acao {
  display:inline-block;
  background:#e8f5e9;
  color:#2e7d32;
  padding:2px 12px;
  border-radius:20px;
  text-decoration:none;
  font-weight:bold;
  margin-left:8px;
  white-space:nowrap;
  border:1px solid #2e7d32;
}
.botao-acao:hover {
  background:#2e7d32;
  color:white;
}

/* Nota legal de custo da chamada (DL 59/2021, rev. Lei 14/2023).
   Tipografia apagada: bloco próprio numa linha, pequeno e cinzento
   claro, sem negrito. Presente para conformidade, visualmente discreta.
   Escondida no modo montra (TV física vista da rua, não é o "sítio da
   Internet" que a lei visa). */
.nota-custo-chamada {
  display:block;
  font-size:10px;
  line-height:1.2;
  color:#aaa;
  font-weight:normal;
  margin-top:1px;
}
.modo-montra .nota-custo-chamada {
  display:none;
}

.footer {
  margin:20px;
  text-align:left;
}

.centro {
  text-align:center;
}

/* Relógio analógico de 24h */
.relogio-wrapper {
  display:flex;
  justify-content:center;
  margin:0;
}
.relogio {
  width:100%;
  max-width:460px;
  height:auto;
}

.footer-trio {
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:end;
  gap:30px;
  max-width:1900px;
  margin:10px auto 0;
  padding:0;
}
.footer-meio {
  display:flex;
  flex-direction:column;
  align-items:center;
}
.footer-esquerda { justify-self:start; }
.footer-direita  { justify-self:end; }
.footer-esquerda, .footer-direita {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  min-width:200px;
  text-align:center;
}
/* QR layout: o balão (à esquerda, opcional) e a imagem do QR (centro)
   numa grid 1fr auto 1fr, para que a imagem fique sempre centrada
   horizontalmente na coluna, independentemente da existência ou
   tamanho do balão. */
.qr {
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  column-gap:10px;
}
.qr > img { grid-column:2; width:160px; }
.qr > .esta-aqui {
  grid-column:1;
  justify-self:end;
  font-weight:bold;
}
.qr .balao {
  width:75px;
  height:auto;
  display:block;
}

a { color:#1976d2; }

/* =====================================================================
   RESPONSIVO — desktop landscape sem scroll; mobile com layout vertical
   ===================================================================== */

/* --- Mobile/vertical: ativa em ecrãs estreitos OU em ecrãs com altura
   insuficiente (laptops com baixa resolução vertical, etc.). Permite scroll. --- */
@media (max-width: 899px), (max-height: 499px) {
  body { background: #eef2f3; }

  .container {
    flex-direction: column;
    padding: 12px;
    gap: 12px;
  }
  /* Aveiro vem primeiro no HTML; em mobile fica naturalmente em cima. */
  .coluna-wrapper { min-width: 0; width: 100%; }
  .coluna { padding: 14px; }

  .titulo-principal { font-size: 20px; }
  .subtitulo { font-size: 15px; }

  /* Footer: tudo empilhado, centrado. Ordem:
     Restam... → relógio → VOCÊ ESTÁ AQUI → QR site → link site → QR Linktree → link Linktree */
  .footer { padding: 0 12px; margin-bottom: 16px; }

  .footer-trio {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    max-width: none;
    margin: 12px 0 0;
    padding: 0;
  }
  .footer-esquerda, .footer-direita {
    min-width: 0;
    width: 100%;
    gap: 12px;
  }
  .footer-meio { gap: 12px; }
  /* No desktop, esquerda = Site, direita = Linktree. No mobile queremos
     Site primeiro, Linktree depois — ordem natural do HTML. */
  .footer-esquerda { order: 1; justify-self: center; }
  .footer-direita  { order: 2; justify-self: center; }

  .relogio { max-width: 220px; }

  /* Quebra forçada para o link ficar legível em ecrãs estreitos */
  .footer a { word-break: break-all; }
}

/* --- Desktop/TV base (≥900px largura E ≥720px altura): sem scroll, layout 2 colunas --- */
@media (min-width: 900px) and (min-height: 500px) {
  body {
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .container {
    padding: 8px 12px;
    gap: 12px;
    flex-shrink: 0;
  }
  .coluna { padding: 10px 14px; }
  .titulo-principal { font-size: 22px; }
  .subtitulo { font-size: 16px; }
  .cruz { width: 34px; height: 34px; }
  .cruz::before { height: 10px; }
  .cruz::after  { width: 10px; }
  .texto, .sub-bloco, .sub-bloco small, .farmacia {
    font-size: 13px;
    line-height: 1.35;
  }
  .sub-bloco { margin-bottom: 6px; }
  .farmacia  { padding: 5px 8px; margin: 5px 0; }
  .footer    { margin: 0 12px 8px; }
  .relogio   { max-width: 180px; }

  /* Footer-trio passa a ser uma grid 3 colunas × 2 linhas:
     Linha 1 (QR | Relógio | QR), Linha 2 (URL | Atualizada | URL).
     Os QRs ficam centrados verticalmente na 1.ª linha → centrados pelo
     centro do relógio. Os textos da 2.ª linha alinham pela base. */
  .footer-trio {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    grid-template-rows: auto auto;
    align-items: end;
    column-gap: 16px;
    row-gap: 8px;
    margin-top: 4px;
  }
  .footer-esquerda, .footer-meio, .footer-direita { display: contents; }
  .footer-esquerda > .qr { grid-column: 1; grid-row: 1; align-self: center; min-width: 0; }
  .footer-esquerda > a   { grid-column: 1; grid-row: 2; min-width: 0; }
  .footer-meio > .relogio-wrapper { grid-column: 2; grid-row: 1; }
  .footer-meio > .centro { grid-column: 2; grid-row: 2; }
  .footer-direita > .qr  { grid-column: 3; grid-row: 1; align-self: center; min-width: 0; }
  .footer-direita > a    { grid-column: 3; grid-row: 2; min-width: 0; }

  .footer-esquerda, .footer-direita { font-size: 11px; }
  .centro { font-size: 11px; }
  .qr > img { width: 80px; }
}

/* --- Desktop médio: 1024–1279 px --- */
@media (min-width: 1024px) and (max-width: 1279px) and (min-height: 500px) {
  .titulo-principal { font-size: 24px; }
  .subtitulo { font-size: 17px; }
  .texto, .sub-bloco, .sub-bloco small, .farmacia { font-size: 14px; }
  .relogio { max-width: 200px; }
}

/* --- Desktop grande: 1280–1799 px --- */
@media (min-width: 1280px) and (max-width: 1799px) and (min-height: 500px) {
  .titulo-principal { font-size: 26px; }
  .subtitulo { font-size: 19px; }
  .texto, .sub-bloco, .sub-bloco small, .farmacia { font-size: 16px; }
  .relogio { max-width: 230px; }
  .footer-trio { row-gap: 12px; }
  .footer-esquerda, .footer-direita { font-size: 13px; }
  .centro { font-size: 13px; }
  .qr > img { width: 110px; }
  .qr .balao { width: 95px; }
}

/* --- TV: 1800 px+ --- */
@media (min-width: 1800px) and (min-height: 500px) {
  .titulo-principal { font-size: 30px; }
  .subtitulo { font-size: 22px; }
  .cruz { width: 42px; height: 42px; }
  .texto, .sub-bloco, .sub-bloco small, .farmacia { font-size: 19px; }
  .container { padding: 12px 18px; gap: 16px; }
  .coluna { padding: 14px 18px; }
  .farmacia { padding: 8px 10px; margin: 8px 0; }
  .relogio { max-width: 270px; }
  .footer-trio { row-gap: 14px; }
  .footer-esquerda, .footer-direita { font-size: 15px; min-width: 220px; }
  .centro { font-size: 15px; }
  .qr > img { width: 130px; }
  .qr .balao { width: 110px; }
}

/* =====================================================================
   DIAGNÓSTICO DE VIEWPORT
   ===================================================================== */

/* Linha permanente sob "Atualizada às...". Subtil, cinzento.
   Em fallback (mobile/baixa altura) fica em fluxo normal.
   Em desktop/TV é absoluta para não quebrar o alinhamento das bases
   da linha 2 do grid (URL site | Atualizada | URL Linktree). */
.update-debug {
  margin-top: 2px;
  font-family: Consolas, 'Courier New', monospace;
  font-size: 11px;
  color: #888;
}
@media (min-width: 900px) and (min-height: 500px) {
  .centro { position: relative; }
  .update-debug {
    position: absolute;
    bottom: 100%;
    left: 0;
    right: 0;
    margin: 0 0 2px 0;
    text-align: center;
  }
}

/* Overlay fixo no canto superior esquerdo. Escondido por defeito;
   activa-se com ?debug=1 na URL (classe .on adicionada via JS). */
#debug-vp {
  display: none;
  position: fixed;
  top: 6px;
  left: 6px;
  z-index: 9999;
  padding: 4px 8px;
  background: rgba(0, 0, 0, 0.75);
  color: #ffeb3b;
  font-family: Consolas, 'Courier New', monospace;
  font-size: 12px;
  font-weight: bold;
  border-radius: 3px;
  pointer-events: none;
  white-space: nowrap;
}
#debug-vp.on { display: block; }

/* =====================================================================
   OVERLAY DO HORÁRIO SEMANAL (?horario=1)
   ===================================================================== */
/* O overlay é fixo, ocupa o viewport todo, e fica sempre visível
   enquanto o parâmetro ?horario=1 estiver na URL. Pensado para uma TV
   dedicada — sem alternância com a vista principal. */

#horario-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #eef2f3;
}

/* Overlay do horário: tabela tipo horário escolar EB2,3, com identidade
   visual alinhada ao resto do site (Arial, verde institucional #2e7d32,
   fundo #eef2f3, caixa branca arredondada). O dia corrente destaca-se
   pela saturação plena das cores; os outros dias usam tons pastel. */
#horario-overlay {
  display: flex;
  flex-direction: column;
  align-items: center;
  /* Alinhamento ao topo (não center): quando o conteúdo é maior que o
     viewport, o centramento esconderia parte do topo. Com flex-start,
     o conteúdo começa sempre no topo e o scroll mostra o resto. */
  justify-content: flex-start;
  padding: 20px;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
  /* Scroll vertical sempre disponível: se o conteúdo couber, a barra
     não aparece; se não couber, aparece automaticamente. Esta solução
     é robusta para qualquer combinação de viewport e dispositivo,
     sem precisar de calibrar limites de media queries. */
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
#horario-overlay .caixa {
  background: white;
  border-radius: 12px;
  padding: 20px;
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  /* Sem max-height nem overflow:hidden: a caixa expande-se ao tamanho
     natural do conteúdo. Se exceder o viewport, o overlay (pai) faz o
     scroll. */
}
/* Linha de diagnóstico no rodapé do overlay: vive na coluna central
   (.fo-meio) do grid do rodapé, por baixo do QR e do link para a raiz.
   pointer-events:none por precaução (texto puramente informativo).
   position:static e bottom/left/right:auto desfazem a regra do CSS
   base (@media min-width:900px) que coloca a .update-debug em
   position:absolute; bottom:100% — herança que tirava a linha do
   fluxo do rodapé do overlay e a empurrava para fora do écran. */
#horario-overlay .update-debug {
  position: static;
  bottom: auto;
  left: auto;
  right: auto;
  margin: 0;
  font-size: clamp(11px, 0.9vw, 14px);
  text-align: center;
  pointer-events: none;
}

/* Rodapé do overlay: três blocos QR com link, esquerda (esta página),
   centro (raiz do site) e direita (Linktree); a coluna central tem ainda
   a linha de diagnóstico por baixo. flex: 0 0 auto impede que o rodapé
   estique e cede o espaço extra para a tabela esticar. */
#horario-overlay .footer-overlay {
  flex: 0 0 auto;
  margin-top: 16px;
  font-size: clamp(13px, 1.4vw, 18px);
  color: #333;
}
/* Grid 3-colunas para o rodapé: QR esquerda | linha de diagnóstico
   central | QR direita. A coluna central é `auto` (dimensionada ao
   conteúdo da .update-debug), as laterais 1fr cada para distribuir
   o espaço restante. align-items:end garante que tudo se alinha pela
   base — base dos QRs laterais, base do texto dos URLs, base do
   texto da .update-debug, todos na mesma linha horizontal. */
#horario-overlay .fo-trio {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: start;
  gap: 30px;
}
#horario-overlay .fo-esquerda,
#horario-overlay .fo-direita {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  text-align: center;
  min-width: 0;
}
#horario-overlay .fo-esquerda { justify-self: start; }
#horario-overlay .fo-direita  { justify-self: end; }
/* Coluna central: QR + link para a raiz do site, e por baixo a linha de
   diagnóstico. Mesma disposição em coluna centrada das laterais. */
#horario-overlay .fo-meio {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  text-align: center;
  justify-self: center;
  min-width: 0;
}
/* QR codes do rodapé do overlay: calibrados para a TV (CSS 960×539,
   DPR 2 → físico 1920×1080) — leitura à distância na montra. */
#horario-overlay .footer-overlay .qr > img {
  width: clamp(85px, 9.5vw, 140px);
}
#horario-overlay .footer-overlay .qr .balao {
  width: clamp(58px, 6vw, 85px);
}
/* Links em linha única, fonte calibrada para mostrar o URL completo
   sem quebra em viewports ≥960px de largura (TV em quiosque). */
#horario-overlay .footer-overlay a {
  white-space: nowrap;
  font-size: clamp(10.5px, 1.1vw, 15px);
  color: #1976d2;
}
#horario-overlay table {
  border-collapse: collapse;
  width: 100%;
  /* flex: 1 0 auto = pode crescer para preencher; nunca encolhe abaixo
     do tamanho natural (necessário desde que a caixa deixou de cortar
     o overflow). */
  flex: 1 0 auto;
  table-layout: fixed;
  font-size: clamp(11px, 1.4vw, 20px);
  line-height: 1.3;
}
#horario-overlay th,
#horario-overlay td {
  border: 1px solid #ccc;
  text-align: center;
  vertical-align: middle;
  padding: 0.35em 0.2em;
}
/* Cabeçalhos: verde institucional. Cabeçalho do dia corrente tem o
   verde pleno; os restantes dias têm o verde dessaturado para se
   integrar com a regra vivo/baço do corpo da tabela. */
#horario-overlay thead th {
  background: #a5c9a8;        /* verde dessaturado por defeito */
  color: white;
  font-weight: bold;
  border-color: #2e7d32;
}
#horario-overlay thead th.hoje {
  background: #2e7d32;        /* verde pleno no dia corrente */
}
/* Span da data: chip arredondado, com cor de fundo a indicar a posição
   cronológica do dia na semana. Convenção alinhada com o resto do site:
   amarelo para futuro (próximo, como o <mark>), azul para hoje (actual,
   como o .data-turno), cinza para passado (histórico, neutro). */
#horario-overlay thead th .data {
  display: block;
  width: fit-content;
  margin: 0.25em auto 0;
  padding: 0 4px;
  border-radius: 3px;
  font-weight: bold;
  font-size: 0.85em;
  color: #000;
}
#horario-overlay thead th.passado .data { background: #eeeeee; }
#horario-overlay thead th.hoje    .data { background: #bbdefb; }
#horario-overlay thead th.futuro  .data { background: #fff59d; }

/* Chip do tipo de horário (Normal / Alargado / Fechada). Cores
   alinhadas com a paleta institucional: verde médio para horário
   regular, laranja (COR_DISP) para regime de disponibilidade, cinza
   (COR_DECORRIDO) para dia fechado. */
#horario-overlay thead th .tipo {
  display: block;
  width: fit-content;
  margin: 0.2em auto 0;
  padding: 0 4px;
  border-radius: 3px;
  font-weight: bold;
  font-size: 0.75em;
}
#horario-overlay thead th .tipo.normal   { background: #a5d6a7; color: #000; }
#horario-overlay thead th .tipo.alargado { background: #ff9800; color: #000; }
#horario-overlay thead th .tipo.fechada  { background: #9e9e9e; color: #fff; }
/* Coluna "Hora": fundo neutro, alinhado com o tom das caixas brancas. */
#horario-overlay tbody th {
  background: #f9fbf9;
  color: #555;
  font-weight: bold;
  width: 15%;
  border-color: #2e7d32;
}
/* Estados das células, baços por defeito. */
#horario-overlay td.aberto  { background: #c8e6c9; }
#horario-overlay td.almoco  { background: #eeeeee; }
#horario-overlay td.fechado { background: #eeeeee; }
/* Estados das células do dia corrente: cores saturadas, com texto
   branco a negrito para legibilidade à distância. */
#horario-overlay td.hoje {
  color: white;
  font-weight: bold;
}
#horario-overlay td.hoje.aberto  { background: #2e7d32; }
#horario-overlay td.hoje.almoco  { background: #9e9e9e; }
#horario-overlay td.hoje.fechado { background: #9e9e9e; }

/* Sub-classes da coluna do dia corrente, atribuídas dinamicamente
   por tickEstadoHoje em função da hora actual. A célula da hora em
   curso recebe uma linha horizontal preta proporcional aos minutos.
   As células das horas já passadas ficam com fundo mais baço, mas
   mantêm texto branco bold (a regra .hoje aplica-se sempre). */
#horario-overlay td.hoje.hoje-passada.aberto  { background: #c8e6c9; }
#horario-overlay td.hoje.hoje-passada.almoco  { background: #eeeeee; }
#horario-overlay td.hoje.hoje-passada.fechado { background: #eeeeee; }

/* Células "extra": horas Aberta que só existem por causa do regime
   alargado (disponibilidade). Substituem o verde pelo laranja COR_DISP
   #ff9800, espelhando a cor do "Restam Xh Xmin até ao fecho" no site.
   Aplica-se a: dias não-corrente, dia corrente vivo, dia corrente
   passada. A regra precisa de vir DEPOIS das regras .aberto base para
   ganhar especificidade igual + ordem. */
#horario-overlay td.aberto.extra                   { background: #ffe0b2; }
#horario-overlay td.hoje.aberto.extra              { background: #ff9800; }
#horario-overlay td.hoje.hoje-passada.aberto.extra { background: #ffe0b2; }
/* Última hora antes do fecho (20h-21h num dia alargado), em curso:
   vermelho de alerta, espelha o COR_ALERTA do "Restam Xh Xmin até ao
   fecho" no site principal durante a mesma janela horária. Quando a
   hora passa, a célula transita para o laranja pastel das outras
   horas extra passadas (regra anterior). */
#horario-overlay td.hoje.aberto.extra.ultima-hora  { background: #d32f2f; }
#horario-overlay td.hoje-actual {
  position: relative;
  /* Sombra subtil no rótulo: assegura legibilidade do texto branco
     bold quando a fronteira pastel/vivo atravessa o centro vertical
     da célula. Sobre os fundos saturados (verde, laranja, vermelho,
     cinzento) a sombra é praticamente invisível; sobre os pastéis
     (#c8e6c9, #ffe0b2, #eeeeee) restitui o contraste perdido. */
  text-shadow: 0 0 3px rgba(0, 0, 0, 0.55);
}
/* Camada baça sobreposta ao topo da célula da hora corrente: desde
   o início da hora (top:0) até à fronteira proporcional aos minutos
   decorridos (height:var(--minuto-pct)). A cor é a mesma das células
   ".hoje-passada" do estado funcional correspondente, de modo a que,
   ao fim da hora, a célula transite suavemente para o seu próximo
   estado (passada). */
#horario-overlay td.hoje-actual::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: var(--minuto-pct, 0%);
  background: var(--cor-baca-actual, transparent);
  pointer-events: none;
  z-index: 1;
}
/* Linha horizontal preta de 2px sobre a fronteira viva/baça. Desce
   continuamente à medida que os minutos avançam dentro da hora. */
#horario-overlay td.hoje-actual::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: var(--minuto-pct, 0%);
  height: 2px;
  background: #000;
  pointer-events: none;
  z-index: 2;
}
/* Cor da camada baça por combinação de estado funcional + extra.
   Espelham os fundos pastel definidos para as células ".hoje-passada"
   do mesmo estado. Para a "ultima-hora" (vermelho), a parte baça é
   o laranja pastel das células extra passadas; a transição final da
   hora 20h-21h fica consistente quando ela própria se torna passada. */
#horario-overlay td.hoje-actual.aberto                    { --cor-baca-actual: #c8e6c9; }
#horario-overlay td.hoje-actual.almoco                    { --cor-baca-actual: #eeeeee; }
#horario-overlay td.hoje-actual.fechado                   { --cor-baca-actual: #eeeeee; }
#horario-overlay td.hoje-actual.aberto.extra              { --cor-baca-actual: #ffe0b2; }
#horario-overlay td.hoje-actual.aberto.extra.ultima-hora  { --cor-baca-actual: #ffe0b2; }

/* Zona entre o título e a tabela: espaço onde o relógio digital flutua
   por cima da coluna do dia corrente. A posição horizontal é definida
   por JS (segue a coluna do dia hoje); a vertical é centrada na zona. */
#horario-overlay .zona-relogio {
  position: relative;
  height: clamp(28px, 4.5vh, 56px);
  margin: 10px 0 6px;
}
#horario-overlay .relogio-digital {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  background: #222;
  color: #ff2a2a;
  font-family: Consolas, "Courier New", monospace;
  font-weight: bold;
  font-size: clamp(14px, 2.2vw, 28px);
  padding: 3px 10px;
  border-radius: 3px;
  white-space: nowrap;
  /* left definido por JS, conforme dia corrente */
  left: 50%;
}
/* =====================================================================
   MODO COMPACTO PARA VIEWPORT BAIXO (TV em quiosque, telemóvel paisagem)
   =====================================================================
   A Sony Bravia reporta-se como 960×539 (DPR 2 → 1920×1080 físicos).
   Em 539px de altura a tabela de 15 linhas + rodapé com QRs não cabe
   com paddings e margens default. Cortes cirúrgicos para evitar scroll,
   sem comprometer legibilidade. Limite a 750px para apanhar também os
   telemóveis em paisagem com viewport CSS escalado (1675×662 num
   Samsung típico, por exemplo). */
@media (max-height: 750px) {
  #horario-overlay { padding: 4px; }
  #horario-overlay .caixa { padding: 6px; }
  /* Cabeçalho (título + cruz) compacto. */
  #horario-overlay .titulo { margin-bottom: 4px; gap: 8px; }
  #horario-overlay .titulo-principal { font-size: 22px; }
  #horario-overlay .subtitulo        { font-size: 14px; }
  #horario-overlay .cruz             { width: 32px; height: 32px; }
  /* Zona do relógio com mais folga vertical para acomodar o relógio
     sem sobrepor a tabela. */
  #horario-overlay .zona-relogio {
    height: 30px;
    margin: 2px 0;
  }
  #horario-overlay .relogio-digital {
    font-size: clamp(12px, 1.8vw, 22px);
    padding: 1px 6px;
  }
  /* Chips do header da tabela mais compactos. */
  #horario-overlay thead th .data { margin: 0.15em auto 0; font-size: 0.8em; }
  #horario-overlay thead th .tipo { margin: 0.1em auto 0; font-size: 0.7em; }
  /* Células com padding mínimo para caber 15 linhas em 539px. */
  #horario-overlay td,
  #horario-overlay th {
    padding: 0.08em 0.2em;
  }
  #horario-overlay table { line-height: 1.15; }
  /* Rodapé do overlay em modo compacto (TV 960×539): margem superior
     reduzida porque o espaço vertical é apertado. Os tamanhos dos QRs
     e fontes não são reduzidos aqui porque os defaults já estão
     calibrados precisamente para o viewport CSS da TV. */
  #horario-overlay .footer-overlay { margin-top: 10px; }
  #horario-overlay .fo-trio { gap: 8px; }
}

/* =====================================================================
   MODO COMPACTO EXTRA PARA TV (viewport CSS ≤ 600px de altura)
   =====================================================================
   Quando o viewport é particularmente baixo (TV 960×539, ou janela de
   PC muito espalmada), aperta-se mais a tabela e o rodapé para garantir
   que tudo cabe sem scroll. Os telemóveis em paisagem têm viewport
   tipicamente >600px e ficam no modo compacto regular acima. */
@media (max-height: 600px) {
  #horario-overlay .footer-overlay .qr > img { width: clamp(70px, 8vw, 110px); }
  #horario-overlay .footer-overlay .qr .balao { width: clamp(48px, 5vw, 72px); }
  #horario-overlay .footer-overlay { margin-top: 6px; font-size: clamp(11px, 1.2vw, 16px); }
  #horario-overlay .footer-overlay a { font-size: clamp(10px, 1vw, 14px); }
  #horario-overlay td,
  #horario-overlay th { padding: 0.04em 0.2em; }
}

<script>

// =====================================================================
// HORA EM LISBOA — Europe/Lisbon, sempre, sem drift de UTC
// =====================================================================

// Devolve componentes de data/hora em Lisboa para um dado instante.
function partesLisboa(date = new Date()) {
  const fmt = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Europe/Lisbon",
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit",
    hour12: false
  });
  const o = {};
  for (const p of fmt.formatToParts(date)) {
    if (p.type !== "literal") o[p.type] = p.value;
  }
  return {
    ano: parseInt(o.year, 10),
    mes: parseInt(o.month, 10),
    dia: parseInt(o.day, 10),
    h:   parseInt(o.hour === "24" ? "0" : o.hour, 10),
    m:   parseInt(o.minute, 10),
    s:   parseInt(o.second, 10),
  };
}

function isoLisboa(p) {
  return `${p.ano}-${String(p.mes).padStart(2,"0")}-${String(p.dia).padStart(2,"0")}`;
}

// Soma N dias a uma data ISO YYYY-MM-DD.
// UTC é só para aritmética de calendário; sem horas envolvidas.
function adicionarDias(iso, dias) {
  const [y, mo, d] = iso.split("-").map(Number);
  const dt = new Date(Date.UTC(y, mo - 1, d));
  dt.setUTCDate(dt.getUTCDate() + dias);
  const yy = dt.getUTCFullYear();
  const mm = String(dt.getUTCMonth() + 1).padStart(2, "0");
  const dd = String(dt.getUTCDate()).padStart(2, "0");
  return `${yy}-${mm}-${dd}`;
}

// =====================================================================
// LÓGICA DE TURNO (mudança às 09:00 Lisboa)
// =====================================================================

function obterDataServico(p = partesLisboa()) {
  const iso = isoLisboa(p);
  return p.h < 9 ? adicionarDias(iso, -1) : iso;
}

// Cores partilhadas
const COR_TURNO      = "#2e7d32"; // verde institucional
const COR_DISP       = "#ff9800"; // laranja disponibilidade
const COR_ALERTA     = "#d32f2f"; // vermelho material (texto e anéis)
const COR_DECORRIDO  = "#9e9e9e"; // cinzento (setor decorrido + estado fechado)

// Hostnames onde o bloco "footer-direita" (Linktree da Farmácia Branco)
// deve ficar escondido. Default é mostrar; só se esconde se explicitamente
// listado aqui. Mantém o comportamento antigo seguro caso um novo Site
// apareça no futuro.
const HOSTNAMES_SEM_LINKTREE = [
  "farmaciaservicoaveiroilhavo.netlify.app"
];

// URL de fallback para o QR e link "Você está aqui" quando a página é
// aberta fora de HTTP (ex.: file:// em testes locais).
const URL_FALLBACK = "https://farmaciaservicoilhavoaveiro.netlify.app/";

// Overlay do horário: tabela 8h–22h × Seg–Dom.
const HORARIO_HORA_INI   = 8;   // primeira linha: 08–09
const HORARIO_HORA_FIM   = 22;  // última linha: 21–22
const HORARIO_DIAS_NOMES = ["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"];

// =====================================================================
// REFERÊNCIAS DOM CACHEADAS
// =====================================================================
// Buscamos cada elemento UMA vez no init. Todas as funções acedem via
// dom.X em vez de chamarem document.getElementById a cada tick.
const dom = {
  // Colunas das farmácias
  ilhavo:               document.getElementById("ilhavo"),
  aveiro:               document.getElementById("aveiro"),
  disponibilidade:      document.getElementById("disponibilidade"),
  periodo:              document.getElementById("periodo"),
  // Footer central
  update:               document.getElementById("update"),
  updateDebug:          document.getElementById("update-debug"),
  debugVp:              document.getElementById("debug-vp"),
  // Relógio: anéis
  setorDecorrido:       document.getElementById("setor-decorrido"),
  setorFalta:           document.getElementById("setor-falta"),
  setorDispDecorrido:   document.getElementById("setor-disponibilidade-decorrido"),
  setorDisp:            document.getElementById("setor-disponibilidade"),
  // Relógio: ponteiro e display digital
  ponteiroHora:         document.getElementById("ponteiro-hora"),
  displayDigital:       document.getElementById("display-digital"),
  // Relógio: datas (3 sítios)
  dataCivil:            document.getElementById("data-civil"),
  dataCivilFundo:       document.getElementById("data-civil-fundo"),
  grupoDataProx:        document.getElementById("grupo-data-prox"),
  dataProximoTurno:     document.getElementById("data-proximo-turno"),
  dataProximoTurnoTopo: document.getElementById("data-proximo-turno-topo"),
  dataTurnoActual:      document.getElementById("data-turno-actual"),
  // Configuração por hostname
  qrSite:               document.getElementById("qr-site"),
  linkSite:             document.getElementById("link-site"),
  footerDireita:        document.getElementById("footer-direita"),
};

// =====================================================================
// DADOS
// =====================================================================

// Carrega o catálogo de farmácias e a escala de um ano específico, do
// ficheiro farmacias-AAAA.json. Em caso de falha devolve null.
async function carregarDados(ano) {
  try {
    const res = await fetch(`/farmacias-${ano}.json`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } catch (err) {
    console.error(`Erro ao carregar farmacias-${ano}.json:`, err);
    const msg = "Erro a carregar dados. Verifique a ligação à internet ou tente recarregar a página.";
    dom.ilhavo.textContent = msg;
    dom.aveiro.textContent = msg;
    return null;
  }
}

function getSlugs(data, calendario) {
  return calendario.find(d => d.data === data)?.farmacias || [];
}

// =====================================================================
// RENDER
// =====================================================================

function render(slugs, catalogo, containerId) {
  const el = dom[containerId];

  if (!slugs.length) {
    el.innerHTML = "Sem dados disponíveis.";
    return;
  }

  el.innerHTML = slugs.map(slug => {
    const f = catalogo[slug];
    if (!f) {
      return `<div class="farmacia">Farmácia desconhecida (${slug})</div>`;
    }

    // Botão "Ver no mapa" inline com o nome da farmácia (se houver link).
    const linkMapa = f.maps
      ? `<a class="botao-acao" href="${f.maps}" target="_blank" rel="noopener noreferrer" aria-label="Ver localização da Farmácia ${f.nome} no Google Maps">📍 Ver no mapa</a>`
      : "";

    // Só na Farmácia Branco: atalho para o seu horário semanal, à direita
    // do "Ver no mapa".
    const linkHorarioBranco = (slug === "branco")
      ? `<a class="botao-acao" href="https://farmaciaservicoilhavoaveiro.netlify.app/farmaciabranco/horario" aria-label="Ver o horário desta semana da Farmácia Branco">🕒 Horário desta semana</a>`
      : "";

    // Uma linha por cada telefone, com botão "Ligar".
    // Em Ílhavo (Disponibilidade) o botão dos números fixos esconde-se fora
    // do horário 9h–21h15. Os móveis (+351 9xx) mantêm-se sempre visíveis.
    const ehIlhavo = (containerId === "ilhavo");
    const telefonesLinhas = (f.telefones || []).map(tel => {
      const numeroLimpo = tel.replace(/\s/g, "");
      const eMovel = numeroLimpo.startsWith("+3519");
      const classeCondicional = (ehIlhavo && !eMovel) ? " ligar-condicional" : "";
      // Nota legal de custo da chamada (DL 59/2021, revisto pela Lei
      // 14/2023). Obrigatória junto de cada número no sítio da Internet.
      // Fixos nacionais (geográficos, começam por 2 ou +3512) → "rede fixa
      // nacional"; móveis (+3519) → "rede móvel nacional". Escondida no
      // modo montra (TV) via CSS .modo-montra .nota-custo-chamada.
      const notaCusto = eMovel
        ? "Chamada para a rede móvel nacional"
        : "Chamada para a rede fixa nacional";
      return `<div>${tel}<a class="botao-acao${classeCondicional}" href="tel:${numeroLimpo}" aria-label="Ligar para ${tel}">📞 Ligar</a><span class="nota-custo-chamada">${notaCusto}</span></div>`;
    }).join("");

    return `
      <div class="farmacia">
        <div class="nome">Farmácia ${f.nome}${linkMapa}${linkHorarioBranco}</div>
        <div>${f.morada}</div>
        ${telefonesLinhas}
      </div>
    `;
  }).join("");
}

function renderDisponibilidade(p, dataServico) {
  // Antes das 21h (e depois das 9h) → ainda vai fechar.
  // Entre as 21h e as 9h do dia seguinte → já fechou.
  const fechado = !(p.h >= 9 && p.h < 21);
  const verbo = fechado ? "Fechou" : "Fecho";
  // Realces para manter identidade visual com o relógio:
  // - Última hora antes do fecho (20:00–20:59): fundo vermelho de alerta.
  // - Após o fecho (já fechou): fundo cinzento, igual ao setor decorrido do relógio.
  let realce;
  if (p.h === 20) {
    realce = `<span style="background:${COR_ALERTA};color:#fff;padding:2px 6px;border-radius:3px;">${verbo} às 21h</span>`;
  } else if (fechado) {
    realce = `<span style="background:${COR_DECORRIDO};color:#fff;padding:2px 6px;border-radius:3px;">${verbo} às 21h</span>`;
  } else {
    realce = `${verbo} às 21h`;
  }

  // Linha "Restam Xh Xmin até ao fecho" só durante o horário aberto (9h–21h).
  // Fora desse horário a linha contém um placeholder invisível (mesmo texto
  // com visibility:hidden) para manter a altura idêntica e alinhar
  // visualmente com a coluna do Aveiro (evita colapso).
  let linhaRestante;
  if (!fechado) {
    const agoraEmMin = p.h * 60 + p.m;
    const restantesDisp = 21 * 60 - agoraEmMin;
    // Última hora antes do fecho (20:00–20:59) → vermelho de alerta.
    const corRestanteDisp = (p.h === 20) ? COR_ALERTA : COR_DISP;
    linhaRestante = `<br><b style="color:${corRestanteDisp};">Restam ${formatarTempoRestante(restantesDisp)}</b> até ao fecho`;
  } else {
    linhaRestante = `<br><span style="visibility:hidden;"><b>Restam 00h00min</b> até ao fecho</span>`;
  }

  const novo = `<small>Regime de Disponibilidade<br>${realce} de <span class="data-turno">${dataServico}</span>${linhaRestante}</small>`;
  if (novo !== ultimoDisponibilidade) {
    dom.disponibilidade.innerHTML = novo;
    ultimoDisponibilidade = novo;
  }
}

function renderPeriodo(p, dataServico) {
  const fim = adicionarDias(dataServico, 1);
  // Minutos até às próximas 09:00 em Lisboa.
  const agoraEmMin = p.h * 60 + p.m;
  const alvoTurno = 9 * 60;
  const restantesTurno = (agoraEmMin < alvoTurno)
    ? alvoTurno - agoraEmMin
    : 24 * 60 - agoraEmMin + alvoTurno;
  // Última hora antes da mudança de turno (08:00–08:59) → vermelho de alerta.
  const corRestanteTurno = (p.h === 8) ? COR_ALERTA : COR_TURNO;
  const linhaRestante = `<b style="color:${corRestanteTurno};">Restam ${formatarTempoRestante(restantesTurno)}</b> até à <mark>mudança de turno</mark>`;
  const novo = `<small>Regime de Permanência<br>Desde as 09h de <span class="data-turno">${dataServico}</span> até às 09h de <mark>${fim}</mark><br>${linhaRestante}</small>`;
  if (novo !== ultimoPeriodo) {
    dom.periodo.innerHTML = novo;
    ultimoPeriodo = novo;
  }
}

function formatHora(p) {
  return `${String(p.h).padStart(2,"0")}h${String(p.m).padStart(2,"0")}min`;
}

// Devolve o tempo restante no formato "01h45min" (sempre com horas e minutos).
function formatarTempoRestante(minutos) {
  const hh = String(Math.floor(minutos / 60)).padStart(2, "0");
  const mm = String(minutos % 60).padStart(2, "0");
  return `${hh}h${mm}min`;
}

function atualizarDatas(p) {
  // Entre 0h e 9h, a data civil aparece com fundo amarelo (calendário já
  // avançou mas o turno ainda é o de ontem). Entre 9h e 23h59 aparece com
  // fundo azul (data corrente do turno).
  const dataFormatada = (p.h < 9)
    ? `<mark>${isoLisboa(p)}</mark>`
    : `<span class="data-turno">${isoLisboa(p)}</span>`;
  const novoUpdate = `Atualizada às <b>${formatHora(p)}</b> do dia ${dataFormatada}`;
  if (novoUpdate !== ultimoUpdate) {
    dom.update.innerHTML = novoUpdate;
    ultimoUpdate = novoUpdate;
  }
}

// Esconde o botão "Ligar" dos telefones fixos das farmácias de Ílhavo fora
// do horário 9h–21h15 (15 minutos de tolerância depois do fecho). Os botões
// dos telemóveis (Branco) mantêm-se sempre visíveis.
// Cache do último estado (true/false/null) para evitar querySelectorAll
// a cada segundo. O estado só pode mudar 2x por dia (9h e 21h15), por isso
// na esmagadora maioria dos ticks saímos cedo.
let ultimaVisibilidadeLigar = null;
function atualizarVisibilidadeLigar(p) {
  const minutosDoDia = p.h * 60 + p.m;
  const dentroDoHorario = (minutosDoDia >= 9 * 60) && (minutosDoDia < 21 * 60 + 15);

  if (dentroDoHorario === ultimaVisibilidadeLigar) return;
  ultimaVisibilidadeLigar = dentroDoHorario;

  document.querySelectorAll(".ligar-condicional").forEach(el => {
    el.style.display = dentroDoHorario ? "" : "none";
  });
}

// =====================================================================
// RELÓGIO ANALÓGICO MILITAR (24h)
// =====================================================================

const SVG_NS = "http://www.w3.org/2000/svg";

// Gera as marcações estáticas do mostrador (chamado uma vez no init).
function gerarMarcacoesRelogio() {
  const grupo = document.getElementById("relogio-marcacoes");
  const cx = 100, cy = 100;

  // Números das horas 1-24 (24 fica no topo). Pretos.
  // Múltiplos de 3 (3, 6, 9, 12, 15, 18, 21, 24) → maiores e a negrito.
  for (let h = 1; h <= 24; h++) {
    const ang = (h * 15 - 90) * Math.PI / 180;
    const r = 80;
    const destacado = (h % 3 === 0);
    const t = document.createElementNS(SVG_NS, "text");
    t.setAttribute("x", cx + r * Math.cos(ang));
    t.setAttribute("y", cy + r * Math.sin(ang));
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("dominant-baseline", "central");
    t.setAttribute("font-family", "Arial, sans-serif");
    t.setAttribute("font-size", destacado ? "13" : "10");
    t.setAttribute("font-weight", destacado ? "bold" : "normal");
    t.setAttribute("fill", "black");
    t.textContent = h;
    grupo.appendChild(t);
  }

  // Ticks das meias-horas (24). Ficam exactamente entre dois ticks de hora.
  for (let h = 0; h < 24; h++) {
    const ang = ((h + 0.5) * 15 - 90) * Math.PI / 180;
    const line = document.createElementNS(SVG_NS, "line");
    line.setAttribute("x1", cx + 68 * Math.cos(ang));
    line.setAttribute("y1", cy + 68 * Math.sin(ang));
    line.setAttribute("x2", cx + 64 * Math.cos(ang));
    line.setAttribute("y2", cy + 64 * Math.sin(ang));
    line.setAttribute("stroke", "#999");
    line.setAttribute("stroke-width", "0.4");
    grupo.appendChild(line);
  }

  // Ticks das horas (24). Mais grossos.
  for (let h = 1; h <= 24; h++) {
    const ang = (h * 15 - 90) * Math.PI / 180;
    const line = document.createElementNS(SVG_NS, "line");
    line.setAttribute("x1", cx + 68 * Math.cos(ang));
    line.setAttribute("y1", cy + 68 * Math.sin(ang));
    line.setAttribute("x2", cx + 64 * Math.cos(ang));
    line.setAttribute("y2", cy + 64 * Math.sin(ang));
    line.setAttribute("stroke", "#333");
    line.setAttribute("stroke-width", "1.2");
    grupo.appendChild(line);
  }
}

// =====================================================================
// ANÉIS DE PROGRESSO (turno + disponibilidade)
// =====================================================================

// Ponto no círculo: ângulo em graus, 0° = topo, sentido horário.
function pontoNoCirculo(cx, cy, r, angGraus) {
  const rad = (angGraus - 90) * Math.PI / 180;
  return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
}

// Caminho SVG para um setor de anel (entre dois raios e dois ângulos).
function pathSetorAnel(cx, cy, rInt, rExt, angInicio, angFim) {
  const delta = angFim - angInicio;
  if (delta <= 0.001) return ""; // setor vazio
  const largeArc = delta > 180 ? 1 : 0;
  const [x1, y1] = pontoNoCirculo(cx, cy, rExt, angInicio);
  const [x2, y2] = pontoNoCirculo(cx, cy, rExt, angFim);
  const [x3, y3] = pontoNoCirculo(cx, cy, rInt, angFim);
  const [x4, y4] = pontoNoCirculo(cx, cy, rInt, angInicio);
  return [
    `M ${x1} ${y1}`,
    `A ${rExt} ${rExt} 0 ${largeArc} 1 ${x2} ${y2}`,
    `L ${x3} ${y3}`,
    `A ${rInt} ${rInt} 0 ${largeArc} 0 ${x4} ${y4}`,
    'Z'
  ].join(' ');
}

// Caminho SVG para o anel completo (donut). Usa fill-rule evenodd no <path>.
function pathAnelCompleto(cx, cy, rInt, rExt) {
  return [
    `M ${cx - rExt} ${cy}`,
    `A ${rExt} ${rExt} 0 1 0 ${cx + rExt} ${cy}`,
    `A ${rExt} ${rExt} 0 1 0 ${cx - rExt} ${cy}`,
    `M ${cx - rInt} ${cy}`,
    `A ${rInt} ${rInt} 0 1 0 ${cx + rInt} ${cy}`,
    `A ${rInt} ${rInt} 0 1 0 ${cx - rInt} ${cy}`,
    'Z'
  ].join(' ');
}

// Anel exterior: turno completo (24h). 5px de espessura.
const R_INT_TURNO = 90, R_EXT_TURNO = 94;
// Anel interior: disponibilidade (das 9h às 21h). 5px de espessura.
const R_INT_DISP  = 84, R_EXT_DISP  = 89;

const ANG_INICIO_TURNO = 9 * 15;  // 135°
const ANG_FIM_DISP     = 21 * 15; // 315°

function atualizarAnelTurno(p) {
  const angHoraActual = (p.h + p.m / 60 + p.s / 3600) * 15;

  let delta = angHoraActual - ANG_INICIO_TURNO;
  if (delta < 0) delta += 360;

  const elDecorrido = dom.setorDecorrido;
  const elFalta     = dom.setorFalta;

  // Última hora antes da mudança de turno (08:00–08:59) → vermelho de alerta.
  const corFalta = (p.h === 8) ? COR_ALERTA : COR_TURNO;
  elFalta.setAttribute("fill", corFalta);

  if (delta < 0.01) {
    elDecorrido.setAttribute("d", "");
    elFalta.setAttribute("d", pathAnelCompleto(100, 100, R_INT_TURNO, R_EXT_TURNO));
  } else if (delta > 359.99) {
    elDecorrido.setAttribute("d", pathAnelCompleto(100, 100, R_INT_TURNO, R_EXT_TURNO));
    elFalta.setAttribute("d", "");
  } else {
    elDecorrido.setAttribute("d",
      pathSetorAnel(100, 100, R_INT_TURNO, R_EXT_TURNO, ANG_INICIO_TURNO, ANG_INICIO_TURNO + delta));
    elFalta.setAttribute("d",
      pathSetorAnel(100, 100, R_INT_TURNO, R_EXT_TURNO, ANG_INICIO_TURNO + delta, ANG_INICIO_TURNO + 360));
  }
}

function atualizarAnelDisponibilidade(p) {
  const elDecorrido = dom.setorDispDecorrido;
  const elFalta     = dom.setorDisp;

  // Só visível entre as 9h e as 21h. Fora deste intervalo, ambos invisíveis.
  if (p.h < 9 || p.h >= 21) {
    elDecorrido.setAttribute("d", "");
    elFalta.setAttribute("d", "");
    return;
  }

  // Última hora antes do fecho (20:00–20:59) → vermelho de alerta.
  const corFalta = (p.h === 20) ? COR_ALERTA : COR_DISP;
  elFalta.setAttribute("fill", corFalta);

  // Setor decorrido: das 9h até à hora actual (cinzento).
  // Setor falta: da hora actual até às 21h (laranja ou vermelho).
  const angHoraActual = (p.h + p.m / 60 + p.s / 3600) * 15;
  elDecorrido.setAttribute("d",
    pathSetorAnel(100, 100, R_INT_DISP, R_EXT_DISP, ANG_INICIO_TURNO, angHoraActual));
  elFalta.setAttribute("d",
    pathSetorAnel(100, 100, R_INT_DISP, R_EXT_DISP, angHoraActual, ANG_FIM_DISP));
}

// Atualiza ponteiro, display digital e ambos os anéis (1x por segundo).
function atualizarRelogio(p = partesLisboa()) {
  // Ponteiro das horas: rotação completa em 24h, suavizada com minutos+segundos.
  const angHora = (p.h + p.m / 60 + p.s / 3600) * 15;
  dom.ponteiroHora.setAttribute(
    "transform", `rotate(${angHora} 100 100)`
  );

  // Display digital hh:mm:ss.
  const hh = String(p.h).padStart(2, "0");
  const mm = String(p.m).padStart(2, "0");
  const ss = String(p.s).padStart(2, "0");
  dom.displayDigital.textContent = `${hh}:${mm}:${ss}`;

  atualizarAnelTurno(p);
  atualizarAnelDisponibilidade(p);
  atualizarDataProximoTurno(p);
}

// Mostra datas à volta do mostrador:
//   - em cima do 24: data do PRÓXIMO turno (amarelo) — única data
//   - ao lado do 9 (acima): data do PRÓXIMO turno (amarelo)
//   - ao lado do 9 (abaixo): data do TURNO ACTUAL (azul); fica mais para
//     dentro porque segue a curvatura do mostrador
// Todas visíveis das 19h45 até às 9h00 do dia seguinte (transição de turno).
// Adicionalmente, debaixo do display digital aparece sempre a DATA CIVIL
// (calendário corrente). O fundo dessa data é amarelo entre 0h e 9h
// (calendário já avançou mas turno ainda é o de ontem) e azul entre 9h e 24h
// (data corrente do turno).
function atualizarDataProximoTurno(p) {
  const minutosDoDia = p.h * 60 + p.m;
  const inicio = 19 * 60 + 45; // 19h45
  const fim    = 9 * 60;       // 9h00

  const isoHoje = isoLisboa(p);

  // Data civil debaixo do display: sempre visível.
  // Fundo amarelo entre 0h e 9h (calendário já avançou, turno ainda é o de
  // ontem). Fundo azul entre 9h e 24h (data corrente do turno).
  dom.dataCivil.textContent = isoHoje;
  const corDataCivil = (minutosDoDia < fim) ? "#fff59d" : "#bbdefb";
  if (corDataCivil !== ultimaCorDataCivil) {
    dom.dataCivilFundo.setAttribute("fill", corDataCivil);
    ultimaCorDataCivil = corDataCivil;
  }

  // Data do próximo turno (acima do 24 e junto ao 9): visível 19h45-9h.
  const grupoExt = dom.grupoDataProx;
  const mostrarExt = (minutosDoDia >= inicio) || (minutosDoDia < fim);

  if (!mostrarExt) {
    grupoExt.style.display = "none";
    return;
  }

  // Próxima 9h: amanhã se já passámos das 19h45, hoje se ainda não chegámos às 9h.
  const dataProxima = (minutosDoDia >= inicio)
    ? adicionarDias(isoHoje, 1)
    : isoHoje;

  // Turno actual: dia em que o turno começou (9h). É a "data de serviço".
  const dataTurnoActual = obterDataServico(p);

  dom.dataProximoTurno.textContent = dataProxima;
  dom.dataProximoTurnoTopo.textContent = dataProxima;
  dom.dataTurnoActual.textContent = dataTurnoActual;
  grupoExt.style.display = "";
}

// =====================================================================
// CICLO PRINCIPAL
// =====================================================================

let dataServicoAnterior = null;

// Cache do último HTML escrito em cada elemento, para evitar re-render quando
// o conteúdo não muda. As funções abaixo só tocam no DOM se o HTML novo for
// diferente do anterior. Reduz reflows de ~240/min para ~2/min.
let ultimoUpdate = "";
let ultimoDisponibilidade = "";
let ultimoPeriodo = "";
let ultimaCorDataCivil = "";

function tick(dados, p = partesLisboa()) {
  const dataServico = obterDataServico(p);

  // Re-renderiza farmácias só quando muda o dia de turno (evita piscar).
  if (dataServico !== dataServicoAnterior) {
    render(getSlugs(dataServico, dados.calendario.ilhavo), dados.farmacias.ilhavo, "ilhavo");
    render(getSlugs(dataServico, dados.calendario.aveiro), dados.farmacias.aveiro, "aveiro");
    dataServicoAnterior = dataServico;
    // Os elementos .ligar-condicional foram recriados — invalidar cache
    // para forçar atualizarVisibilidadeLigar() a re-aplicar o estado.
    ultimaVisibilidadeLigar = null;
  }

  renderDisponibilidade(p, dataServico);
  renderPeriodo(p, dataServico);
  atualizarDatas(p);
  atualizarVisibilidadeLigar(p);
}

// =====================================================================
// CONFIGURAÇÃO POR HOSTNAME
// =====================================================================
// O mesmo index.html é servido por vários sites Netlify. Cada um tem
// hostname diferente. Esta função adapta dinamicamente:
//   - O QR e o link "Você está aqui" → apontam para o próprio URL
//   - O bloco Linktree (footer-direita) → escondido em hostnames
//     listados em HOSTNAMES_SEM_LINKTREE
// Default: tudo visível. Esconder é opt-in explícito.

function aplicarConfigPorHostname() {
  // URL onde a página está a correr. Se for file:// (testes locais),
  // location.origin pode ser "null" ou "file://"; nesse caso usa-se
  // o URL principal (Site B) como fallback.
  const origem = location.origin && location.origin.startsWith("http")
    ? location.origin + "/"
    : URL_FALLBACK;

  // QR "Você está aqui": gerado via api.qrserver.com com a URL actual.
  const apiQr = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=";
  dom.qrSite.src = apiQr + encodeURIComponent(origem);

  // Link "Você está aqui": href e texto visível.
  dom.linkSite.href = origem;
  dom.linkSite.textContent = origem;

  // Esconde o bloco Linktree se o hostname estiver na whitelist.
  if (HOSTNAMES_SEM_LINKTREE.includes(location.hostname)) {
    dom.footerDireita.style.display = "none";
  }
}

// =====================================================================
// CALENDÁRIO DE FERIADOS (calendario.json)
// =====================================================================
// Carregado em paralelo com farmacias.json. Em caso de falha, o horário
// fica indisponível, mas o resto do site continua a funcionar.

async function carregarCalendario(ano) {
  try {
    const res = await fetch(`/calendario-${ano}.json`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } catch (err) {
    console.error(`Erro ao carregar calendario-${ano}.json:`, err);
    return null;
  }
}
// Índice dos anos publicados (anos.json). Em caso de falha, devolve uma
// lista vazia; quem chama trata o recuo.
async function carregarAnos() {
  try {
    const res = await fetch("/anos.json");
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const j = await res.json();
    return Array.isArray(j.anos) ? j.anos.slice().sort((a, b) => a - b) : [];
  } catch (err) {
    console.error("Erro ao carregar anos.json:", err);
    return [];
  }
}

// =====================================================================
// HORÁRIO DA FARMÁCIA BRANCO (?horario=1)
// =====================================================================
// Computa o horário da Branco para um dado dia, com base no tipo de
// dia (útil/sábado/domingo/feriado) e regime (com/sem disponibilidade).
//
// Regras:
//   Útil sem disp:     09–13 + 14–20 (almoço 13–14)
//   Útil com disp:     09–13 + 14–21 (almoço 13–14)
//   Sábado sem disp:   09–13 + 15–19 (almoço 13–15)
//   Sábado com disp:   09–13 + 15–21 (almoço 13–15)
//   Domingo sem disp:  fechado
//   Domingo com disp:  09–13 + 15–21 (almoço 13–15)
//   Feriado sem disp:  fechado
//   Feriado com disp:  09–13 + 15–21 (almoço 13–15)

// Verifica se "branco" está nas disponibilidades de Ílhavo na data ISO
// dada, consultando o farmacias.json já em memória (`dados`).
function eDisponibilidadeBranco(iso, dados) {
  const lista = dados && dados.calendario && dados.calendario.ilhavo;
  if (!Array.isArray(lista)) return false;
  for (const entry of lista) {
    if (entry.data === iso) return Array.isArray(entry.farmacias)
                                 && entry.farmacias.includes("branco");
  }
  return false;
}

function eFeriado(iso, calendario) {
  return calendario && Array.isArray(calendario.feriados)
      && calendario.feriados.includes(iso);
}

// Devolve o horário Branco para a data iso, no formato:
//   { aberto: true, manha: [9,13], almoco: [13,14], tarde: [14,20] }
//   { aberto: false }
function horarioBrancoDia(iso, calendario, dados) {
  const feriado = eFeriado(iso, calendario);
  const disp    = eDisponibilidadeBranco(iso, dados);
  // Dia da semana: 0=Dom, 1=Seg, ..., 6=Sáb (Date.getUTCDay)
  const [y, mo, d] = iso.split("-").map(Number);
  const ds = new Date(Date.UTC(y, mo - 1, d)).getUTCDay();
  const eDomingo = ds === 0;
  const eSabado  = ds === 6;

  // Dias fechados: domingo ou feriado, ambos sem disponibilidade.
  if ((eDomingo || feriado) && !disp) return { aberto: false };

  // Com disponibilidade, todos os fins-de-semana/feriados/sáb seguem
  // o padrão alargado: 9–13 + 15–21, almoço 13–15.
  if (disp && (eDomingo || feriado || eSabado)) {
    return { aberto: true, manha: [9,13], almoco: [13,15], tarde: [15,21] };
  }
  // Sábado sem disp.
  if (eSabado) {
    return { aberto: true, manha: [9,13], almoco: [13,15], tarde: [15,19] };
  }
  // Dia útil com disp.
  if (disp) {
    return { aberto: true, manha: [9,13], almoco: [13,14], tarde: [14,21] };
  }
  // Dia útil sem disp.
  return { aberto: true, manha: [9,13], almoco: [13,14], tarde: [14,20] };
}

// Devolve o número de horas de porta aberta de um dia, dado o seu
// horário no formato de horarioBrancoDia. O almoço NÃO conta: é o
// intervalo entre manha[1] e tarde[0], que não está incluído em
// nenhuma das duas janelas. Dia fechado conta 0.
function horasAbertoDia(horario) {
  if (!horario || !horario.aberto) return 0;
  let total = 0;
  if (horario.manha) total += horario.manha[1] - horario.manha[0];
  if (horario.tarde) total += horario.tarde[1] - horario.tarde[0];
  return total;
}

// Para uma hora h (intervalo [h, h+1)), devolve o estado nesse intervalo:
// "aberto" | "almoco" | "fechado".
function estadoCelula(horario, h) {
  if (!horario.aberto) return "fechado";
  const dentro = (intv) => intv && h >= intv[0] && h < intv[1];
  if (dentro(horario.almoco)) return "almoco";
  if (dentro(horario.manha) || dentro(horario.tarde)) return "aberto";
  return "fechado";
}

// Devolve o horário Branco para a data iso COMO SE NÃO HOUVESSE
// disponibilidade nesse dia. Usado para identificar as horas "extra"
// que aparecem por estarmos em regime alargado — comparativamente ao
// horário normal do dia da semana.
function horarioBrancoNormal(iso) {
  const [y, mo, d] = iso.split("-").map(Number);
  const ds = new Date(Date.UTC(y, mo - 1, d)).getUTCDay();
  const eDomingo = ds === 0;
  const eSabado  = ds === 6;
  // Domingo (e feriado) sem disp = fechado.
  if (eDomingo) return { aberto: false };
  // Sábado sem disp.
  if (eSabado) return { aberto: true, manha: [9,13], almoco: [13,15], tarde: [15,19] };
  // Dia útil sem disp.
  return { aberto: true, manha: [9,13], almoco: [13,14], tarde: [14,20] };
}

// Para uma hora h num dia iso de regime alargado (disponibilidade),
// devolve true se essa hora seria FECHADA no horário normal do dia da
// semana — ou seja, é uma hora extra que só existe por causa da disp.
// Feriados em dias úteis são considerados como o dia útil normal seria
// (fechado se feriado nacional caísse num dia útil, mas como o calendário
// não distingue feriado em dia útil de dia útil normal aqui, usamos
// apenas o dia da semana como base do "normal").
function eHoraExtra(iso, h, calendario, dados) {
  if (!eDisponibilidadeBranco(iso, dados)) return false;
  const normal = horarioBrancoNormal(iso);
  // Se o dia seria fechado no normal (domingo) e a hora é Aberta no
  // alargado, é toda extra.
  if (!normal.aberto) return true;
  const estadoNoNormal = estadoCelula(normal, h);
  // Feriado em dia útil/sábado: no normal estaria fechado todo o dia.
  // Tratamento simples: se for feriado, todas as horas Abertas são extra.
  if (eFeriado(iso, calendario)) return true;
  // Caso geral: hora é extra se no normal seria Fechada (não Aberta nem Almoço).
  return estadoNoNormal === "fechado";
}

// Cria o overlay do horário (tabela vazia) e injecta no body se

  if (!/^\/farmaciabranco\/horario\/?$/.test(location.pathname)) return null;

  const overlay = document.createElement("div");
  overlay.id = "horario-overlay";
  overlay.setAttribute("aria-hidden", "true");

  // Caixa branca arredondada (mimetiza o estilo das colunas da vista
  // principal), contendo título + tabela.
  const caixa = document.createElement("div");
  caixa.className = "caixa";
  overlay.appendChild(caixa);

  // Cabeçalho com a mesma identidade visual dos cabeçalhos das colunas
  // de farmácia (cruz verde + título principal + subtítulo).
  const cabec = document.createElement("div");
  cabec.className = "titulo";
  const cruz = document.createElement("div");
  cruz.className = "cruz";
  const textos = document.createElement("div");
  const tp = document.createElement("div");
  tp.className = "titulo-principal";
  tp.textContent = "Farmácia Branco";
  const st = document.createElement("div");
  st.className = "subtitulo";
  st.textContent = "Horário desta semana";
  // Linha com o total de horas de porta aberta da semana mostrada.
  // Valor dinâmico (varia conforme a semana), preenchido em
  // popularTabelaHorario; aqui só se cria o elemento. Partilha a
  // classe .subtitulo para acompanhar o escalonamento responsivo.
  // É um link para a página de estatística, sem realce visual.
  const tf = document.createElement("a");
  tf.className = "subtitulo tempo-funcionamento";
  tf.href = "https://farmaciaservicoilhavoaveiro.netlify.app/farmaciabranco/estatistica";
  textos.appendChild(tp);
  textos.appendChild(st);
  textos.appendChild(tf);
  cabec.appendChild(cruz);
  cabec.appendChild(textos);
  caixa.appendChild(cabec);

  // Zona com o relógio digital, posicionado por cima da coluna do dia
  // corrente. O relógio flutua em posição absoluta; a sua coluna é
  // definida em popularTabelaHorario e reajustada no resize.
  const zonaRelogio = document.createElement("div");
  zonaRelogio.className = "zona-relogio";
  const relogio = document.createElement("div");
  relogio.className = "relogio-digital";
  relogio.textContent = "--:--:--";
  zonaRelogio.appendChild(relogio);
  caixa.appendChild(zonaRelogio);

  const tabela = document.createElement("table");

  // Cabeçalho: Hora | Seg dd/mm | Ter dd/mm | ...
  const thead = document.createElement("thead");
  const trHead = document.createElement("tr");
  const thHora = document.createElement("th");
  thHora.textContent = "Hora";
  trHead.appendChild(thHora);
  const thsDias = [];
  for (let i = 0; i < 7; i++) {
    const th = document.createElement("th");
    th.appendChild(document.createTextNode(HORARIO_DIAS_NOMES[i]));
    const sp = document.createElement("span");
    sp.className = "data";
    th.appendChild(sp);
    const tipo = document.createElement("span");
    tipo.className = "tipo";
    th.appendChild(tipo);
    trHead.appendChild(th);
    thsDias.push({ th, sp, tipo });
  }
  thead.appendChild(trHead);
  tabela.appendChild(thead);

  // Corpo: 1 linha por hora, 1 célula por dia.
  const tbody = document.createElement("tbody");
  const celulas = []; // matriz [hora][dia]
  for (let h = HORARIO_HORA_INI; h < HORARIO_HORA_FIM; h++) {
    const tr = document.createElement("tr");
    const thH = document.createElement("th");
    thH.textContent = `${String(h).padStart(2,"0")}h00 - ${String(h+1).padStart(2,"0")}h00`;
    tr.appendChild(thH);
    const linha = [];
    for (let d = 0; d < 7; d++) {
      const td = document.createElement("td");
      tr.appendChild(td);

    tbody.appendChild(tr);
    celulas.push(linha);
  }
  tabela.appendChild(tbody);
  caixa.appendChild(tabela);

  // Rodapé com QR + link à esquerda (apontando para a página actual do

  // display:contents a .footer-esquerda/.footer-meio/.footer-direita.
  const footer = document.createElement("div");
  footer.className = "footer-overlay";

    <div class="fo-trio">

              <text x="45" y="40" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-weight="bold" font-size="16">VOCÊ</text>
              <text x="45" y="58" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-weight="bold" font-size="16">ESTÁ</text>
              <text x="45" y="76" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-weight="bold" font-size="16">AQUI</text>
            </svg>
          </div>
          <img class="qr-img-horario" alt="QR code para o horário desta semana">
        </div>
        <a class="link-horario" target="_blank" rel="noopener noreferrer"></a>
      </div>
      <div class="fo-meio">
        <div class="qr">
          <img class="qr-img-raiz" alt="QR code para a página inicial do site">
        </div>
        <a class="link-raiz" target="_blank" rel="noopener noreferrer"></a>
      </div>
      <div class="fo-direita">
        <div class="qr">
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://linktr.ee/farmaciabrancogafanha" alt="QR code para o Linktree da Farmácia Branco">
        </div>
        <a href="https://linktr.ee/farmaciabrancogafanha" target="_blank" rel="noopener noreferrer">https://linktr.ee/farmaciabrancogafanha</a>
      </div>
    </div>
  `;
  caixa.appendChild(footer);

  // Preenche o QR e o link da página actual do horário. Constrói o URL
  // a partir do origin actual; em file:// (testes locais) cai no
  // URL_FALLBACK. A lógica é equivalente à de aplicarConfigPorHostname.
  const origem = location.origin && location.origin.startsWith("http")
    ? location.origin
    : URL_FALLBACK.replace(/\/$/, "");
  const urlHorario   = origem + "/farmaciabranco/horario";
  const apiQrHorario = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=";
  const qrImgHorario = footer.querySelector(".qr-img-horario");
  const linkHorario  = footer.querySelector(".link-horario");
  qrImgHorario.src    = apiQrHorario + encodeURIComponent(urlHorario);
  linkHorario.href    = urlHorario;
  linkHorario.textContent = urlHorario;

  // Centro: QR e link para a raiz do site (página inicial). origem já vem
  // sem barra final; a raiz é origem + "/".
  const urlRaiz    = origem + "/";
  const qrImgRaiz  = footer.querySelector(".qr-img-raiz");
  const linkRaiz   = footer.querySelector(".link-raiz");
